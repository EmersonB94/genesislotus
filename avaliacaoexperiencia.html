<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avaliação de Experiência - Genesis Lotus</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { display:flex; min-height:100vh; margin:0; background:#0E3E98; color:white; font-family:'Poppins',sans-serif; }
  aside { width:250px; background:#0D187D; padding:20px; display:flex; flex-direction:column; justify-content:space-between; }
  .logo { font-weight:700; text-align:center; margin-bottom:30px; font-size:1.5rem; }
  nav a { display:block; color:white; text-decoration:none; padding:12px 15px; border-radius:8px; margin-bottom:8px; transition:background 0.3s; }
  nav a:hover, nav a.active { background:#0E3E98; }
  main { flex:1; padding:30px; background:#0E3E98; display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; }
  header h1 { font-size:1.5rem; font-weight:600; }
  .btn { background:#fff; color:#0E3E98; border:none; padding:10px 18px; border-radius:8px; cursor:pointer; font-weight:600; transition:0.3s; }
  .btn:hover { background:#0D187D; color:#fff; }
  section { background:#0D187D; border-radius:12px; padding:20px; box-shadow:0 4px 10px rgba(0,0,0,0.3); flex:1; }
  form { display:flex; flex-wrap:wrap; gap:15px; margin-bottom:20px; }
  input, select { padding:10px; border:none; border-radius:8px; flex:1; min-width:180px; }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  th, td { text-align:left; padding:10px; border-bottom:1px solid rgba(255,255,255,0.2); }
  th { color:#fff; }
  td { color:#f0f0f0; }
  .grupo { margin-top:20px; }
  .grupo h3 { border-bottom:1px solid white; padding-bottom:5px; }
</style>
</head>
<body>
  <aside>
    <div>
      <div class="logo">GENESIS LOTUS</div>
      <nav>
        <a href="dashboard.html" class="active"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
        <a href="indicadores.html"><i class="fa-solid fa-bullseye"></i> Indicadores</a>
        <a href="acoestreinamentos.html"><i class="fa-solid fa-users"></i> Ações e Treinamentos</a>
        <a href="requisicaopessoal.html"><i class="fa-solid fa-users"></i> Requisição de pessoal</a>
        <a href="avaliacaoexperiencia.html"><i class="fa-solid fa-users"></i> Avaliação de experiência</a>
        <a href="usuario.html"><i class="fa-solid fa-users"></i> Usuários</a>
        <a href="empresa.html"><i class="fa-solid fa-users"></i> Empresa</a>
      </nav>
    </div>
    <footer style="text-align:center; font-size:0.8rem; opacity:0.8;">© 2025 Genesis Lotus</footer>
  </aside>

  <main>
    <header>
      <h1>Avaliação de Experiência</h1>
      <button class="btn" onclick="sair()">Sair</button>
    </header>

    <section>
      <form id="formAvaliacao" onsubmit="salvarAvaliacao(event)">
        <select id="empresa" required></select>
        <input type="text" id="colaborador" placeholder="Colaborador" required>
        <input type="text" id="cargo" placeholder="Cargo" required>
        <input type="date" id="dataRequisicaoCargo" required>
        <input type="date" id="dataAdmissao" required>
        <input type="date" id="dataIntegracao" required>
        <input type="date" id="primeiraAvaliacao" placeholder="1ª Avaliação Experiência">
        <input type="date" id="segundaAvaliacao" placeholder="2ª Avaliação Experiência">
        <input type="text" id="padrinho" placeholder="Nome do Padrinho">
        <input type="date" id="dataApadrinhamento" placeholder="Data Apadrinhamento">
        <select id="status">
          <option value="Em experiência">Em experiência</option>
          <option value="Contratado">Contratado</option>
          <option value="Desligado">Desligado</option>
        </select>
        <input type="date" id="dataDesligamento">
        <button type="submit" class="btn">Registrar</button>
      </form>

      <div id="tabelaAvaliacao"></div>
    </section>
  </main>

<script>
const usuarioLogado = JSON.parse(localStorage.getItem("usuarioLogado"));
let avaliacoes = JSON.parse(localStorage.getItem("avaliacoes")) || [];
let empresas = JSON.parse(localStorage.getItem("empresas")) || [];

if(!usuarioLogado) window.location.href="index.html";

// Preencher select de empresas ativas (corrigido para "Ativa" ou "Ativo")
const selectEmpresa = document.getElementById("empresa");
empresas
  .filter(e => e.status === "Ativa" || e.status === "Ativo")
  .forEach(e => {
    const option = document.createElement("option");
    option.value = e.nome;
    option.textContent = e.nome;
    selectEmpresa.appendChild(option);
  });


function sair(){
  localStorage.removeItem("usuarioLogado");
  window.location.href="index.html";
}

function salvarAvaliacao(event){
  event.preventDefault();
  const a = {
    empresa: document.getElementById("empresa").value,
    colaborador: document.getElementById("colaborador").value,
    cargo: document.getElementById("cargo").value,
    dataRequisicaoCargo: document.getElementById("dataRequisicaoCargo").value,
    dataAdmissao: document.getElementById("dataAdmissao").value,
    dataIntegracao: document.getElementById("dataIntegracao").value,
    primeiraAvaliacao: document.getElementById("primeiraAvaliacao").value,
    segundaAvaliacao: document.getElementById("segundaAvaliacao").value,
    padrinho: document.getElementById("padrinho").value,
    dataApadrinhamento: document.getElementById("dataApadrinhamento").value,
    status: document.getElementById("status").value,
    dataDesligamento: document.getElementById("dataDesligamento").value,
    usuario: usuarioLogado.nome,
    dataHoraRegistro: new Date().toLocaleString()
  };

  avaliacoes.push(a);
  localStorage.setItem("avaliacoes", JSON.stringify(avaliacoes));
  document.getElementById("formAvaliacao").reset();
  carregarTabela();
}

function carregarTabela(){
  const container = document.getElementById("tabelaAvaliacao");
  const statusUnicos = [...new Set(avaliacoes.map(a => a.status))];

  container.innerHTML = statusUnicos.map(status => {
    const porStatus = avaliacoes.filter(a => a.status === status);
    if(porStatus.length===0) return '';

    const empresasUnicas = [...new Set(porStatus.map(a => a.empresa))];

    return `
      <div class="grupo">
        <h3>Status: ${status}</h3>
        ${empresasUnicas.map(emp => {
          const items = porStatus.filter(a => a.empresa===emp);
          return `
            <div class="grupo-cliente">
              <h4>Empresa: ${emp}</h4>
              <table>
                <thead>
                  <tr>
                    <th>Colaborador</th><th>Cargo</th><th>Data Requisição</th><th>Data Admissão</th><th>Data Integração</th>
                    <th>1ª Avaliação</th><th>2ª Avaliação</th><th>Padrinho</th><th>Data Apadrinhamento</th>
                    <th>Data Desligamento</th><th>Usuário</th><th>Data/Hora Registro</th>
                  </tr>
                </thead>
                <tbody>
                  ${items.map(i => `
                    <tr>
                      <td>${i.colaborador}</td>
                      <td>${i.cargo}</td>
                      <td>${i.dataRequisicaoCargo}</td>
                      <td>${i.dataAdmissao}</td>
                      <td>${i.dataIntegracao}</td>
                      <td>${i.primeiraAvaliacao || '-'}</td>
                      <td>${i.segundaAvaliacao || '-'}</td>
                      <td>${i.padrinho || '-'}</td>
                      <td>${i.dataApadrinhamento || '-'}</td>
                      <td>${i.dataDesligamento || '-'}</td>
                      <td>${i.usuario}</td>
                      <td>${i.dataHoraRegistro}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          `;
        }).join("")}
      </div>
    `;
  }).join("");

  if (!container.innerHTML) {
    container.innerHTML = "<p>Nenhuma avaliação registrada.</p>";
  }
}

carregarTabela();
</script>
</body>
</html>
