<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requisição de Pessoal - Genesis Lotus</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { display:flex; min-height:100vh; margin:0; background:#0E3E98; color:white; font-family:'Poppins',sans-serif; }
  aside { width:250px; background:#0D187D; padding:20px; display:flex; flex-direction:column; justify-content:space-between; }
  .logo { font-weight:700; text-align:center; margin-bottom:30px; font-size:1.5rem; }
  nav a { display:block; color:white; text-decoration:none; padding:12px 15px; border-radius:8px; margin-bottom:8px; transition:background 0.3s; }
  nav a:hover, nav a.active { background:#0E3E98; }
  main { flex:1; padding:30px; background:#0E3E98; display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; }
  header h1 { font-size:1.5rem; font-weight:600; }
  .btn { background:#fff; color:#0E3E98; border:none; padding:10px 18px; border-radius:8px; cursor:pointer; font-weight:600; transition:0.3s; }
  .btn:hover { background:#0D187D; color:#fff; }
  section { background:#0D187D; border-radius:12px; padding:20px; box-shadow:0 4px 10px rgba(0,0,0,0.3); flex:1; }
  form { display:flex; flex-wrap:wrap; gap:15px; margin-bottom:20px; }
  input, select, textarea { padding:10px; border:none; border-radius:8px; flex:1; min-width:180px; }
  table { width:100%; border-collapse:collapse; margin-top:10px; }
  th, td { text-align:left; padding:10px; border-bottom:1px solid rgba(255,255,255,0.2); }
  th { color:#fff; }
  td { color:#f0f0f0; }
  .grupo-cliente { margin-top:20px; }
  .grupo-cliente h3 { border-bottom:1px solid white; padding-bottom:5px; }
</style>
</head>
<body>
  <aside>
    <div>
      <div class="logo">GENESIS LOTUS</div>
      <nav>
        <a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
        <a href="indicadores.html"><i class="fa-solid fa-bullseye"></i> Indicadores</a>
        <a href="acoestreinamentos.html"><i class="fa-solid fa-users"></i> Ações e Treinamentos</a>
        <a href="requisicaopessoal.html"><i class="fa-solid fa-users"></i> Requisição de pessoal</a>
        <a href="avaliacaoexperiencia.html"><i class="fa-solid fa-users"></i> Avaliação de experiência</a>
        <a href="usuario.html"><i class="fa-solid fa-users"></i> Usuários</a>
        <a href="empresa.html"><i class="fa-solid fa-building"></i> Empresas</a>
      </nav>
    </div>
    <footer style="text-align:center; font-size:0.8rem; opacity:0.8;">© 2025 Genesis Lotus</footer>
  </aside>

  <main>
    <header>
      <h1>Requisição de Pessoal</h1>
      <button class="btn" onclick="sair()">Sair</button>
    </header>

    <section>
      <form id="formRequisicao" onsubmit="salvarRequisicao(event)">
        <select id="empresa" required></select>
        <input type="date" id="dataRequisicao" required readonly>
        <input type="text" id="cargo" placeholder="Cargo" required>
        <input type="text" id="solicitante" placeholder="Solicitante" readonly>
        <select id="motivo">
          <option value="Substituição">Substituição</option>
          <option value="Aumento de quadro">Aumento de quadro</option>
        </select>
        <textarea id="observacoes" placeholder="Observações"></textarea>
        <input type="date" id="dataCobertura">
        <button type="submit" class="btn">Registrar</button>
      </form>

      <div id="tabelaRequisicoes"></div>
    </section>
  </main>

<script>
const usuarioLogado = JSON.parse(localStorage.getItem("usuarioLogado"));
let requisicoes = JSON.parse(localStorage.getItem("requisicoes")) || [];
let empresas = JSON.parse(localStorage.getItem("empresas")) || [];

if(!usuarioLogado) window.location.href="index.html";

// Preencher empresas no select
const selectEmpresa = document.getElementById("empresa");
empresas.forEach(e => {
  const option = document.createElement("option");
  option.value = e.nome;
  option.textContent = e.nome;
  selectEmpresa.appendChild(option);
});

// Dados iniciais do formulário
document.getElementById("solicitante").value = usuarioLogado.nome;
document.getElementById("dataRequisicao").value = new Date().toISOString().split("T")[0];

function sair(){
  localStorage.removeItem("usuarioLogado");
  window.location.href="index.html";
}

function salvarRequisicao(event){
  event.preventDefault();
  const dataSolicitacao = new Date(document.getElementById("dataRequisicao").value);
  const dataCobertura = document.getElementById("dataCobertura").value ? new Date(document.getElementById("dataCobertura").value) : null;
  const tempoCobertura = dataCobertura ? Math.floor((dataCobertura - dataSolicitacao)/(1000*60*60*24)) : '';

  const r = {
    empresa: document.getElementById("empresa").value,
    dataRequisicao: document.getElementById("dataRequisicao").value,
    cargo: document.getElementById("cargo").value,
    solicitante: usuarioLogado.nome,
    motivo: document.getElementById("motivo").value,
    observacoes: document.getElementById("observacoes").value,
    dataCobertura: document.getElementById("dataCobertura").value,
    usuarioRegistro: usuarioLogado.nome,
    dataAtualizacao: new Date().toLocaleString(),
    tempoCobertura: tempoCobertura
  };

  requisicoes.push(r);
  localStorage.setItem("requisicoes", JSON.stringify(requisicoes));
  document.getElementById("formRequisicao").reset();
  document.getElementById("dataRequisicao").value = new Date().toISOString().split("T")[0];
  carregarTabela();
}

function carregarTabela(){
  const container = document.getElementById("tabelaRequisicoes");
  const empresasUnicas = [...new Set(requisicoes.map(r => r.empresa))];

  container.innerHTML = empresasUnicas.map(emp => {
    const items = requisicoes.filter(r => r.empresa===emp);
    if(items.length===0) return '';

    return `
      <div class="grupo-cliente">
        <h3>Empresa: ${emp}</h3>
        <table>
          <thead>
            <tr>
              <th>Data Requisição</th><th>Cargo</th><th>Solicitante</th><th>Motivo</th>
              <th>Observações</th><th>Data Cobertura</th><th>Usuário Registro</th>
              <th>Data Atualização</th><th>Tempo Cobertura (dias)</th>
            </tr>
          </thead>
          <tbody>
            ${items.map(i => `
              <tr>
                <td>${i.dataRequisicao}</td>
                <td>${i.cargo}</td>
                <td>${i.solicitante}</td>
                <td>${i.motivo}</td>
                <td>${i.observacoes}</td>
                <td>${i.dataCobertura||''}</td>
                <td>${i.usuarioRegistro}</td>
                <td>${i.dataAtualizacao}</td>
                <td>${i.tempoCobertura}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }).join('');
}

carregarTabela();
</script>
</body>
</html>
