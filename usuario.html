<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários - Genesis Lotus</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  
  <style>
    .logo { font-weight:700; text-align:center; margin-bottom:30px; font-size:1.5rem; }

    .btn1 { background:#ffffff; color:#0E3E98; border:none; padding:10px 18px; border-radius:8px; cursor:pointer; font-weight:600; transition:0.3s; }
    .btn1:hover { background:#0D187D; color:#fff; }

    .btn2 { background:#ffffff; color:#000000; border:none; padding:10px 18px; border-radius:8px; cursor:pointer; font-weight:600; transition:0.3s; }
    .btn2:hover { background:#0D187D; color:#fff; }

    .btn-edit, .btn-status { background:#fff; color:#0E3E98; padding:6px 12px; border:none; border-radius:6px; cursor:pointer; margin-right:5px; }
    .btn-edit:hover, .btn-status:hover { background:#0E3E98; color:white; }

    .inactive { color:#ff4b4b; font-weight:bold; }
    table { width:100%; border-collapse:collapse; margin-top:20px; }
    th, td { border:1px solid #ccc; padding:8px; text-align:center; }
    th { background:#0E3E98; color:#fff; }
  </style>
</head>
<body>
  <aside>
    <div>
      <div class="logo">GENESIS LOTUS</div>
      <p>Bem-vindo, <span id="usuarioLogado"></span></p>
      
      <nav>
        <a href="inicio"><i class="fa-solid fa-chart-line"></i> Início</a>
        <a href="usuario" class="active"><i class="fa-solid fa-users"></i> Usuários</a>
        <a href="empresa"><i class="fa-solid fa-building"></i> Empresas</a>
      </nav>
    </div>
    <footer style="text-align:center; font-size:0.8rem; opacity:0.8;">© 2025 Genesis Lotus</footer>
  </aside>

  <main>
    <header>
      <h1><i class="fa-solid fa-users"></i> Usuários</h1>
      <button class="btn1" onclick="abrirForm()">
      <i class="fa-solid fa-plus"></i> Adicionar
    </button>

      <button class="btn1" onclick="sair()">Sair</button>
    </header>

    <section>
      <div id="areaTabela"></div>
    </section>
  </main>

  <div id="overlayContainer"></div>

  <script>
    const areaTabela = document.getElementById("areaTabela");
    const overlayContainer = document.getElementById("overlayContainer");

    function sair(){
      localStorage.removeItem("usuarioLogado");
      window.location.href="/";
    }

    async function carregarUsuarios(){
      try {
        const resp = await fetch("http://localhost:5000/usuarios");
        const data = await resp.json();
        if(!resp.ok) throw new Error(data.mensagem || "Erro ao buscar usuários.");
        renderTabela(data.usuarios);
      } catch(e){
        console.error(e);
        areaTabela.innerHTML = "<p style='color:red;'>Erro ao carregar usuários.</p>";
      }
    }

    function abrirForm(usuario=null){
      overlayContainer.innerHTML = `
        <div class="overlay">
          <div class="form-popup">
            <button class="close-btn" onclick="fecharForm()">×</button>
            <h3>${usuario ? "Editar Usuário" : "Novo Usuário"}</h3>
            <form onsubmit="salvarUsuario(event, ${usuario ? usuario.id : null})">
              <input type="text" id="nomeUsuario" value="${usuario?usuario.nome:''}" placeholder="Nome completo" required>
              <input type="email" id="emailUsuario" value="${usuario?usuario.email:''}" placeholder="E-mail" required>
              <input type="text" id="contatoUsuario" value="${usuario?usuario.contato:''}" placeholder="Contato">
              <input type="password" id="senhaUsuario" value="${usuario?usuario.senha:''}" placeholder="Senha" required>
              <input type="text" id="setorUsuario" value="${usuario?usuario.setor:''}" placeholder="Setor / Departamento">
              <select id="nivelUsuario">
                <option value="Leitor" ${usuario&&usuario.nivel_usuario==="Leitor"?"selected":""}>Leitor</option>
                <option value="Editar" ${usuario&&usuario.nivel_usuario==="Editar"?"selected":""}>Editar</option>
                <option value="Inserir" ${usuario&&usuario.nivel_usuario==="Inserir"?"selected":""}>Inserir</option>
                <option value="Administrador" ${usuario&&usuario.nivel_usuario==="Administrador"?"selected":""}>Administrador</option>
              </select>
              <select id="empresa" required>
                <option value="">Selecione a empresa...</option>
              </select>
              <select id="statusUsuario">
                <option value="Ativo" ${usuario&&usuario.status==="Ativo"?"selected":""}>Ativo</option>
                <option value="Inativo" ${usuario&&usuario.status==="Inativo"?"selected":""}>Inativo</option>
              </select>
              <button type="submit" class="btn2" style="margin-top:10px;"> <i class="fa-solid fa-floppy-disk"></i> Salvar</button>
              <button type="button" class="btn2" style="margin-top:10px;" onclick="fecharForm()">Fechar / Cancelar</button>
            </form>
          </div>
        </div>
      `;

      carregarEmpresas(usuario); // <-- passa o usuário para selecionar a empresa correta
    }

    function fecharForm(){
      overlayContainer.innerHTML = "";
    }

    async function salvarUsuario(event, idEditar=null){
      event.preventDefault();
      const payload = {
        nome: document.getElementById("nomeUsuario").value.trim(),
        email: document.getElementById("emailUsuario").value.trim(),
        contato: document.getElementById("contatoUsuario").value.trim(),
        senha: document.getElementById("senhaUsuario").value.trim(),
        setor: document.getElementById("setorUsuario").value.trim(),
        empresa: document.getElementById("empresa").value, // corrigido
        nivel_usuario: document.getElementById("nivelUsuario").value,
        status: document.getElementById("statusUsuario").value
      };

      try {
        let resp;
        if(idEditar){
          resp = await fetch(`http://localhost:5000/usuario/${idEditar}`, {
            method:"PUT",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify(payload)
          });
        } else {
          resp = await fetch("http://localhost:5000/cadastrar", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify(payload)
          });
        }

        const data = await resp.json();
        if(resp.ok && data.sucesso){
          alert(data.mensagem);
          fecharForm();
          carregarUsuarios();
        } else {
          alert(data.mensagem || "Erro ao salvar usuário.");
        }
      } catch(e){
        console.error(e);
        alert("Erro de conexão com o servidor.");
      }
    }

    function renderTabela(usuarios){
      areaTabela.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Nome</th><th>E-mail</th><th>Contato</th><th>Setor</th><th>Nível</th><th>Status</th><th>Empresa</th><th>Ações</th>
            </tr>
          </thead>
          <tbody>
            ${usuarios.map(u=>`
              <tr>
                <td>${u.nome}</td>
                <td>${u.email}</td>
                <td>${u.contato || ''}</td>
                <td>${u.setor || ''}</td>
                <td>${u.nivel_usuario || ''}</td>
                <td class="${u.status==="Inativo"?"inactive":""}">${u.status || ''}</td>
                <td>${u.empresa || ''}</td>
                <td>
                  <button class="btn-edit" onclick='abrirForm(${JSON.stringify(u)})'> <i class="fa-solid fa-pen-to-square"></i> Editar</button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    carregarUsuarios();

    // === CARREGAR EMPRESAS DO BANCO ===
    async function carregarEmpresas(usuario=null) {
      try {
        const response = await fetch('/empresas');
        const data = await response.json();

        if (data.empresas && Array.isArray(data.empresas)) {
          const select = document.getElementById('empresa');
          select.innerHTML = '<option value="">Selecione a empresa...</option>';
          data.empresas.forEach(emp => {
            const option = document.createElement('option');
            option.value = emp.nome_fantasia;
            option.textContent = emp.nome_fantasia;
            select.appendChild(option);
          });

          // Seleciona a empresa do usuário, se estiver editando
          if(usuario) {
            select.value = usuario.empresa || '';
          }

        } else {
          console.error('Nenhuma empresa encontrada.');
        }
      } catch (error) {
        console.error('Erro ao carregar empresas:', error);
      }
    }
  </script>
</body>
</html>
