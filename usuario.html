<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários - Genesis Lotus</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { display:flex; min-height:100vh; margin:0; background:#0E3E98; color:white; font-family:'Poppins',sans-serif; }
    aside { width:250px; background:#0D187D; padding:20px; display:flex; flex-direction:column; justify-content:space-between; }
    .logo { font-weight:700; text-align:center; margin-bottom:30px; font-size:1.5rem; }
    nav a { display:block; color:white; text-decoration:none; padding:12px 15px; border-radius:8px; margin-bottom:8px; transition:background 0.3s; }
    nav a:hover, nav a.active { background:#0E3E98; }
    main { flex:1; padding:30px; background:#0E3E98; display:flex; flex-direction:column; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; }
    header h1 { font-size:1.5rem; font-weight:600; }
    .btn { background:#fff; color:#0E3E98; border:none; padding:10px 18px; border-radius:8px; cursor:pointer; font-weight:600; transition:0.3s; }
    .btn:hover { background:#0D187D; color:#fff; }
    section { background:#0D187D; border-radius:12px; padding:20px; box-shadow:0 4px 10px rgba(0,0,0,0.3); flex:1; }
    form { display:flex; flex-wrap:wrap; gap:15px; margin-bottom:20px; }
    input, select { padding:10px; border:none; border-radius:8px; flex:1; min-width:200px; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th, td { text-align:left; padding:10px; border-bottom:1px solid rgba(255,255,255,0.2); }
    th { color:#fff; }
    td { color:#f0f0f0; }
    .btn-edit { background:#fff; color:#0E3E98; padding:6px 12px; border:none; border-radius:6px; cursor:pointer; margin-right:5px; }
    .btn-edit:hover { background:#0D187D; color:white; }
  </style>
</head>
<body>
  <aside>
    <div>
      <div class="logo">GENESIS LOTUS</div>
      <nav>
        <a href="/dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
        <a href="/indicadores"><i class="fa-solid fa-bullseye"></i> Indicadores</a>
        <a href="/acoestreinamentos"><i class="fa-solid fa-chalkboard-teacher"></i> Ações e Treinamentos</a>
        <a href="/requisicaopessoal"><i class="fa-solid fa-user-plus"></i> Requisição de Pessoal</a>
        <a href="/avaliacaoexperiencia"><i class="fa-solid fa-star"></i> Avaliação de Experiência</a>
        <a href="/usuario" class="active"><i class="fa-solid fa-users"></i> Usuários</a>
        <a href="/empresa"><i class="fa-solid fa-building"></i> Empresas</a>
      </nav>
    </div>
    <footer style="text-align:center; font-size:0.8rem; opacity:0.8;">© 2025 Genesis Lotus</footer>
  </aside>

  <main>
    <header>
      <h1>Usuários</h1>
    </header>

    <section>
      <div id="areaForm"></div>
      <div id="areaTabela"></div>
    </section>
  </main>

  <script>
    const areaForm = document.getElementById("areaForm");
    const areaTabela = document.getElementById("areaTabela");

    async function carregarUsuarios() {
      const res = await fetch("/usuarios");
      const usuarios = await res.json();
      areaTabela.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Nome</th><th>Email</th><th>Setor</th><th>Contato</th><th>Tipo</th><th>CPF</th><th>Dt Nasc</th><th>Empresa</th><th>Dt Cadastro</th><th>Ações</th>
            </tr>
          </thead>
          <tbody>
            ${usuarios.map(u=>`
              <tr>
                <td>${u.nome}</td>
                <td>${u.email}</td>
                <td>${u.setor}</td>
                <td>${u.contato}</td>
                <td>${u.tipo}</td>
                <td>${u.cpf}</td>
                <td>${u.dtnascimento}</td>
                <td>${u.empresa}</td>
                <td>${u.dtcadastro}</td>
                <td><button class="btn-edit" onclick='editarUsuario(${JSON.stringify(u)})'>Editar</button></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function editarUsuario(u){
      areaForm.innerHTML = `
        <form onsubmit="salvarUsuario(event, ${u.id})">
          <input type="text" id="nome" placeholder="Nome" value="${u.nome}" required>
          <input type="email" id="email" placeholder="Email" value="${u.email}" required>
          <input type="text" id="setor" placeholder="Setor" value="${u.setor}">
          <input type="text" id="contato" placeholder="Contato" value="${u.contato}">
          <input type="password" id="senha" placeholder="Senha" value="${u.senha}">
          <select id="tipo">
            <option value="Leitor" ${u.tipo=="Leitor"?"selected":""}>Leitor</option>
            <option value="Editar" ${u.tipo=="Editar"?"selected":""}>Editar</option>
            <option value="Inserir" ${u.tipo=="Inserir"?"selected":""}>Inserir</option>
            <option value="Administrador" ${u.tipo=="Administrador"?"selected":""}>Administrador</option>
          </select>
          <input type="text" id="cpf" placeholder="CPF" value="${u.cpf}">
          <input type="date" id="dtnascimento" placeholder="Data Nascimento" value="${u.dtnascimento}">
          <input type="text" id="empresa" placeholder="Empresa" value="${u.empresa}">
          <button type="submit" class="btn">Salvar</button>
        </form>
      `;
    }

    function novoUsuario(){
      areaForm.innerHTML = `
        <form onsubmit="salvarUsuario(event)">
          <input type="text" id="nome" placeholder="Nome" required>
          <input type="email" id="email" placeholder="Email" required>
          <input type="text" id="setor" placeholder="Setor">
          <input type="text" id="contato" placeholder="Contato">
          <input type="password" id="senha" placeholder="Senha">
          <select id="tipo">
            <option value="Leitor">Leitor</option>
            <option value="Editar">Editar</option>
            <option value="Inserir">Inserir</option>
            <option value="Administrador">Administrador</option>
          </select>
          <input type="text" id="cpf" placeholder="CPF">
          <input type="date" id="dtnascimento" placeholder="Data Nascimento">
          <input type="text" id="empresa" placeholder="Empresa">
          <button type="submit" class="btn">Cadastrar</button>
        </form>
      `;
    }

    async function salvarUsuario(e, id=null){
      e.preventDefault();
      const data = {
        nome: document.getElementById("nome").value,
        email: document.getElementById("email").value,
        setor: document.getElementById("setor").value,
        contato: document.getElementById("contato").value,
        senha: document.getElementById("senha").value,
        tipo: document.getElementById("tipo").value,
        cpf: document.getElementById("cpf").value,
        dtnascimento: document.getElementById("dtnascimento").value,
        empresa: document.getElementById("empresa").value
      };

      if(id){
        await fetch(`/usuarios/${id}`, {
          method: "PUT",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify(data)
        });
      } else {
        await fetch("/usuarios", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify(data)
        });
      }
      carregarUsuarios();
      areaForm.innerHTML = "";
    }

    // Inicial
    carregarUsuarios();
  </script>
</body>
</html>
