<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários - Genesis Lotus</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  
  <style>
    .inactive { color:#ff4b4b; font-weight:bold; }

    /* === AJUSTE: Estilo do modal padronizado === */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
      animation: fadeIn 0.3s ease;
    }

    .modal {
      background: #fff;
      border-radius: 10px;
      padding: 25px;
      width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      animation: scaleIn 0.3s ease;
    }

    .modal h3 {
      margin-bottom: 15px;
      text-align: center;
    }

    .modal input, 
    .modal select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .modal .btn {
      width: 100%;
      margin-top: 5px;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #555;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    

  
  </style>
</head>
<body>
  <aside>
    <div>
      <div class="logo">
      <img src="/static/image/LogoGenesis-Lotus2.png" alt="Genesis Lotus" class="logo-img">
    </div>
    <h4>Olá, <span id="usuarioLogado"></span></p></h4   >      <nav>
        <a href="inicio"><i class="fa-solid fa-chart-line"></i> Início</a>
        <a onclick="abrirUsuario()" class="active"><i class="fa-solid fa-users"></i> Usuários</a>
        <a href="empresa"><i class="fa-solid fa-building"></i> Empresas</a>
        <a href="chamados_admin"><i class="fa-solid fa-headset"></i></i> Chamados</a>
        <a href="ficha_indicadores"><i class="fa-solid fa-building"></i> Ficha Indicadores</a>
        <a href="movimentacoes"><i class="fa-solid fa-building"></i> Movimentações</a>
      </nav>
    </div>
    <footer style="text-align:center; font-size:0.8rem; opacity:0.8;">© 2025 Genesis Lotus</footer>
  </aside>

  <main>
    <header>
      <h1><i class="fa-solid fa-users"></i> Usuários</h1>
      <button class="btn" onclick="abrirForm()"><i class="fa-solid fa-plus"></i> Adicionar</button>
      <button class="btn" onclick="sair()">Sair</button>
    </header>

    <section>
      <div id="areaTabela"></div>
    </section>
  </main>

  <!-- Contêiner dinâmico para o modal -->
  <!-- Modal fixo no HTML -->
  <div id="overlayContainer" class="overlay" style="display:none;" onclick="clicarForaModal(event)">
  <div class="modal">
    <button class="close-btn" onclick="fecharForm()">×</button>
    <h3 id="tituloForm">Novo Usuário</h3>

    <form id="formUsuario" onsubmit="salvarUsuario(event)">

      <label class="logo">Nome completo</label>
      <input type="text" id="nomeUsuario" placeholder="Digite o nome completo" required>

      <label class="logo">E-mail</label>
      <input type="email" id="emailUsuario" placeholder="Digite o e-mail" required>

      <label class="logo">Contato</label>
      <input type="text" id="contatoUsuario" placeholder="Telefone ou WhatsApp">

      <label class="logo">Senha</label>
      <input type="password" id="senhaUsuario" placeholder="Defina uma senha" required>

      <label class="logo">Setor / Departamento</label>
      <input type="text" id="setorUsuario" placeholder="Setor do colaborador">

      <label class="logo">Cargo</label>
      <input type="text" id="cargoUsuario" placeholder="Cargo do colaborador">

      <label class="logo">Nível de acesso</label>
      <select id="nivelUsuario">
        <option value="Leitor">Leitor</option>
        <option value="Inserir/Editar">Inserir/Editar</option>
        <option value="Inserir/Editar/Excluir">Inserir/Editar/Excluir</option>
        <option value="Administrador">Administrador</option>
      </select>

      <label class="logo">Empresas permitidas</label>
      <select id="empresa" multiple required size="5" style="height:auto;">
        <option value="">Selecione uma ou mais empresas...</option>
      </select>

      <p style="font-size:0.8rem; color:#555; margin-top:5px;">
        Segure <b>Ctrl</b> (Windows) ou <b>Cmd</b> (Mac) para selecionar várias.
      </p>

      <label class="logo">Permissões</label>

      <fieldset>
        <label class="logo">RH<input type="checkbox" id="modRH" class="logo"></label>
        <label class="logo">DP<input type="checkbox" id="modDP" class="logo"></label>
        <label class="logo">SST <input type="checkbox" id="modSST" class="logo"></label>
        <label class="logo">ADM<input type="checkbox" id="modAdm" class="logo"></label>
      </fieldset>
      </p>

      <label class="logo">Status</label>
      <select id="statusUsuario">
        <option value="Ativo">Ativo</option>
        <option value="Inativo">Inativo</option>
        <option value="Suspenso">Suspenso</option>
        <option value="Suspenso Inatividade">Suspenso Inatividade</option>
      </select>

      <button type="submit" class="btn" style="margin-top:10px;">
        <i class="fa-solid fa-floppy-disk"></i> Salvar
      </button>

      <button type="button" class="btn" style="margin-top:10px;" onclick="fecharForm()">Cancelar</button>
    
    
    </form>
  </div>
</div>

  <div id="toast-container"></div>


  <script>
    const usuarioLogado = JSON.parse(localStorage.getItem("usuarioLogado"));
    document.getElementById("usuarioLogado").innerText = usuarioLogado?.nome || "";

    function abrirUsuario() {
      const u = JSON.parse(localStorage.getItem("usuarioLogado"));
      window.location.href = `/usuario?email=${encodeURIComponent(u.email)}`;
    }
    
    const areaTabela = document.getElementById("areaTabela");
    const overlayContainer = document.getElementById("overlayContainer");

    function showToast(message, tipo = "success") {
      const container = document.getElementById("toast-container");

      const toast = document.createElement("div");
      toast.classList.add("toast");

      if (tipo === "success") toast.classList.add("toast-success");
      else toast.classList.add("toast-error");

      toast.textContent = message;

      container.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 3500);
    } 


    // === Função auxiliar de formatação de data ===
    function formatarData(dataISO) {
      if (!dataISO) return "";
      const data = new Date(dataISO);
      const dia = String(data.getDate()).padStart(2, "0");
      const mes = String(data.getMonth() + 1).padStart(2, "0");
      const ano = data.getFullYear();
      return `${dia}/${mes}/${ano}`;
    } 

    function sair(){
      localStorage.removeItem("usuarioLogado");
      window.location.href="/";
    }

    async function carregarUsuarios(){
      try {
        const resp = await fetch("/usuarios");
        const data = await resp.json();
        if(!resp.ok) throw new Error(data.mensagem || "Erro ao buscar usuários.");
        renderTabela(data.usuarios);
      } catch(e){
        console.error(e);
        areaTabela.innerHTML = "<p style='color:red;'>Erro ao carregar usuários.</p>";
      }
    }

    let idEditando = null;

    function abrirForm(usuario = null){
      idEditando = usuario ? usuario.id : null;

      document.getElementById("overlayContainer").style.display = "flex";
      document.getElementById("tituloForm").innerText = usuario ? "Editar Usuário" : "Novo Usuário";

      document.getElementById("nomeUsuario").value = usuario ? usuario.nome : "";
      document.getElementById("emailUsuario").value = usuario ? usuario.email : "";
      document.getElementById("contatoUsuario").value = usuario ? usuario.contato : "";
      document.getElementById("senhaUsuario").value = usuario ? usuario.senha : "";
      document.getElementById("setorUsuario").value = usuario ? usuario.setor : "";
      document.getElementById("cargoUsuario").value = usuario ? usuario.cargo : "";
      document.getElementById("nivelUsuario").value = usuario ? usuario.nivel_usuario : "Leitor";
      document.getElementById("statusUsuario").value = usuario ? usuario.status : "Ativo";
      
      document.getElementById("modRH").checked = usuario && usuario.modrh === "S";
      document.getElementById("modDP").checked = usuario && usuario.moddp === "S";
      document.getElementById("modSST").checked = usuario && usuario.modsst === "S";
      document.getElementById("modAdm").checked = usuario && usuario.modadm === "S";

      carregarEmpresas(usuario);
    }


    /* === Fecha o modal ao clicar fora === */
    function clicarForaModal(event){
      if(event.target.id === "overlayContainer"){
        fecharForm();
      }
    }


    /* === Fecha modal === */
    function fecharForm(){
      document.getElementById("overlayContainer").style.display = "none";
    }


    /* === Salvar Usuário === */
    async function salvarUsuario(event){
      event.preventDefault();
      const idEditar = idEditando;
      const payload = {
        nome: document.getElementById("nomeUsuario").value.trim(),
        email: document.getElementById("emailUsuario").value.trim(),
        contato: document.getElementById("contatoUsuario").value.trim(),
        senha: document.getElementById("senhaUsuario").value.trim(),
        setor: document.getElementById("setorUsuario").value.trim(),
        cargo: document.getElementById("cargoUsuario").value.trim(),
        empresa: Array.from(document.getElementById("empresa").selectedOptions).map(opt => opt.value).join(";"),
        nivel_usuario: document.getElementById("nivelUsuario").value,
        status: document.getElementById("statusUsuario").value,
        modrh: document.getElementById("modRH").checked ? "S" : "N",
        moddp: document.getElementById("modDP").checked ? "S" : "N",
        modsst: document.getElementById("modSST").checked ? "S" : "N",
        modadm: document.getElementById("modAdm").checked ? "S" : "N"
      };

      try {
        let resp;
        if(idEditar){
          resp = await fetch(`/usuario/${idEditar}`, {
            method:"PUT",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify(payload)
          });
        } else {
          resp = await fetch("/cadastrar", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify(payload)
          });
        }

        const data = await resp.json();
        if(resp.ok && data.sucesso){
          showToast(data.mensagem, "success");
          fecharForm();
          carregarUsuarios();
        } else {
          showToast(data.mensagem || "Erro ao salvar usuário.", "error");
        }
      } catch(e){
        console.error(e);
        showToast("Erro de conexão com o servidor.", "error");
      }
    }

    /* === Renderizar tabela === */
    function renderTabela(usuarios){
      areaTabela.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Contato</th>
              <th>Setor</th>
              <th>Nível</th>
              <th>Empresa</th>
              <th>Acesso</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            ${usuarios.map(u=>`
              <tr>
                <td>${u.nome}</td>
                <td>${u.email}</td>
                <td>${u.contato || ''}</td>
                <td>${u.setor || ''}</td>
                <td>${u.nivel_usuario || ''}</td>
                <td>${u.empresa || ''}</td>
                <td>${formatarData(u.dtacesso)}</td>
                <td class="${u.status==="Inativo"?"inactive":""}">${u.status || ''}</td>
                <td>
                  <button class="btn" onclick='abrirForm(${JSON.stringify(u)})'>
                    <i class="fa-solid fa-pen-to-square"></i> Editar
                  </button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    carregarUsuarios();

    /* === Carregar empresas === */
    async function carregarEmpresas(usuario=null) {
      try {
        const response = await fetch('/empresas');
        const data = await response.json();

        if (data.empresas && Array.isArray(data.empresas)) {
          const select = document.getElementById('empresa');
          select.innerHTML = '<option value="">Selecione a empresa...</option>';
          data.empresas.forEach(emp => {
            const option = document.createElement('option');
            option.value = emp.nome_fantasia;
            option.textContent = emp.nome_fantasia;
            select.appendChild(option);
          });

          if (usuario && usuario.empresa) {
            const empresasUsuario = usuario.empresa.split(";").map(e => e.trim());
            for (let opt of select.options) {
              if (empresasUsuario.includes(opt.value)) opt.selected = true;
            }
          }
        }
      } catch (error) {
        console.error('Erro ao carregar empresas:', error);
        showToast("Erro ao carregar empresas", "error");
      }
    }
  </script>
</body>
</html>
