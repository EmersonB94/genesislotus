<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ações / Treinamentos</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/static/css/meurh.css">

<style>
  .logo { font-weight:700; text-align:center; margin-bottom:30px; font-size:1.5rem; }
  .btn { background:#fff; color:#0E3E98; border:none; padding:10px 18px; border-radius:8px; cursor:pointer; font-weight:600; transition:0.3s; }
  .btn:hover { background:#0d707d; color:#fff; } /* mouse por cima do botão */
  .filters { display:flex; gap:15px; flex-wrap:wrap; margin-bottom:15px; }
  table { width:100%; border-collapse:collapse; background:#fff; color:#000; border-radius:10px; overflow:hidden; }
  th, td { padding:8px 10px; border-bottom:1px solid #ccc; font-size:0.9rem; }
  th { background:#0b6372a1; color:#fff; } /* Titulo da tabela */
</style>
</head>
<body>
  <aside>
    <div>
      <div class="logo">GENESIS LOTUS</div>
      <p>Bem-vindo, <span id="usuarioLogado"></span>!</p>
      <nav>
        <a href="inicio"><i class="fa-solid fa-chart-line"></i> Início</a>
        <a href="indicadores"><i class="fa-solid fa-bullseye"></i> Indicadores</a>
        <a href="meu_rh" class="active"><i class="fa-solid fa-puzzle-piece"></i> Meu RH</a>
        <a href="meu_rh_acoes_treinamentos" class="active"><i class="fa-solid fa-chalkboard-teacher"></i> Ações e Treinamentos</a>
        <a href="meu_rh_acoes_treinamentos"><i class="fa-solid fa-book-open"></i> Avaliação de Experiência</a>
        <a href="meu_rh_acoes_treinamentos"><i class="fa-solid fa-chalkboard-teacher"></i> Requisições de Pessoal</a>
      </nav>
    </div>
    <footer style="text-align:center; font-size:0.8rem; opacity:0.8;">© 2025 Genesis Lotus</footer>
  </aside>

  <main>
    <header>
      <h1>Ações / Treinamentos</h1>
      <div>
        <button class="btn" onclick="abrirFormulario()">Novo Registro</button>
        <button class="btn" onclick="sair()">Sair</button>
      </div>
    </header>

    <section>
      <div class="filters">
        <a>Data inicial</a>
        <input type="date" id="filtroInicio">
        <a>Data final</a>
        <input type="date" id="filtroFim">
        <select id="filtroTipo">
          <option value="Todos">Todos</option>
          <option value="Treinamento">Treinamento</option>
          <option value="Ação">Ação</option>
        </select>
        <button class="btn" onclick="carregarTabela()">Filtrar</button>
      </div>

      <div id="tabelaTreinamentos"></div>
    </section>
  </main>

  <!-- Modal de cadastro -->
<div id="form-popup" class="overlay" style="display:none;">
  <div class="form-popup">
    <h2>Novo Registro</h2>
    <form id="formTreinamento" onsubmit="salvarTreinamento(event)">
      <select id="empresa" required>
        <option value="">Selecione a empresa...</option>
      </select>
      <input type="text" id="tema" placeholder="Tema" required>
      <textarea id="realizado" placeholder="O que foi realizado" required></textarea>
      <input type="date" id="dataRealizacao" required>
      <input type="text" id="local" placeholder="Local">
      <select id="tipoAcao">
        <option value="Treinamento">Treinamento</option>
        <option value="Ação">Ação</option>
      </select>
      <input type="number" id="duracao" placeholder="Duração (horas)" min="0" step="0.1">
      <input type="text" id="departamento" placeholder="Departamento Responsável">
      <input type="text" id="responsavel" placeholder="Pessoal Responsável">
      <select id="modalidade">
        <option value="Presencial">Presencial</option>
        <option value="Virtual">Virtual</option>
      </select>
      <select id="pat">
        <option value="Sim">Sim</option>
        <option value="Não">Não</option>
      </select>
      <input type="number" id="participantes" placeholder="Total de Participantes" min="0">
      <button type="submit" class="btn">Salvar</button>
      <button type="button" class="btn" onclick="fecharFormulario()">Fechar</button>
    </form>
  </div>
</div>

<script>

let editandoId = null;

const API = "http://localhost:5000/acoes_treinamentos";

function abrirFormulario(){
  document.getElementById("form-popup").style.display = "flex";
  editandoId = null;
}

function fecharFormulario(){
  document.getElementById("form-popup").style.display = "none";
  document.getElementById("formTreinamento").reset();
  editandoId = null; // ← limpar modo edição
}


function sair(){
  localStorage.removeItem("usuarioLogado");
  alert("Sessão encerrada.");
}

// === SALVAR (NOVO) ===
async function salvarTreinamento(event){
  event.preventDefault();
  const dados = {
    empresa: document.getElementById("empresa").value,
    tema: document.getElementById("tema").value,
    realizado: document.getElementById("realizado").value,
    dataRealizacao: document.getElementById("dataRealizacao").value,
    local: document.getElementById("local").value,
    tipoAcao: document.getElementById("tipoAcao").value,
    duracao: document.getElementById("duracao").value,
    departamento: document.getElementById("departamento").value,
    responsavel: document.getElementById("responsavel").value,
    modalidade: document.getElementById("modalidade").value,
    pat: document.getElementById("pat").value,
    participantes: document.getElementById("participantes").value
  };

  const resp = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(dados)
  });
  const resultado = await resp.json();
  alert(resultado.mensagem);
  if(resultado.sucesso){
    fecharFormulario();
    carregarTabela();
  }
}

// === CARREGAR ===
async function carregarTabela(){
  const resp = await fetch(API);
  const dados = await resp.json();
  if(!dados.sucesso) return alert("Erro ao carregar registros.");
  
  const registros = dados.dados;
  const inicio = document.getElementById("filtroInicio").value;
  const fim = document.getElementById("filtroFim").value;
  const tipo = document.getElementById("filtroTipo").value;

  const container = document.getElementById("tabelaTreinamentos");
  const empresas = [...new Set(registros.map(t => t.empresa))];

  container.innerHTML = empresas.map(emp => {
    const items = registros.filter(t => 
      t.empresa === emp &&
      (tipo === "Todos" || t.tipo_acao === tipo) &&
      (!inicio || t.data_realizacao >= inicio) &&
      (!fim || t.data_realizacao <= fim)
    );
    if(items.length === 0) return '';
    return `
      <div class="grupo-cliente">
        <h3>Empresa: ${emp}</h3>
        <table>
          <thead>
            <tr>
              <th>Tema</th><th>Realizado</th><th>Data</th><th>Local</th><th>Tipo</th>
              <th>Duração</th><th>Departamento</th><th>Responsável</th><th>Modalidade</th>
              <th>PAT</th><th>Participantes</th><th>Ações</th>
            </tr>
          </thead>
          <tbody>
            ${items.map(i => `
              <tr>
                <td>${i.tema}</td>
                <td>${i.realizado}</td>
                <td>${i.data_realizacao}</td>
                <td>${i.local}</td>
                <td>${i.tipo_acao}</td>
                <td>${i.duracao}</td>
                <td>${i.departamento}</td>
                <td>${i.responsavel}</td>
                <td>${i.modalidade}</td>
                <td>${i.pat}</td>
                <td>${i.participantes}</td>
                <td>
                  <button class="btn" onclick="editar(${i.id})">Editar</button>
                  <button class="btn" onclick="excluir(${i.id})">Excluir</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }).join('');
}

// === EDITAR (carrega os dados no form) ===
async function editar(id){
  const resp = await fetch(API);
  const dados = await resp.json();
  const reg = dados.dados.find(r => r.id === id);
  if(!reg) return;

  abrirFormulario();
  editandoId = id; // ← aqui

  document.getElementById("empresa").value = reg.empresa;
  document.getElementById("tema").value = reg.tema;
  document.getElementById("realizado").value = reg.realizado;
  document.getElementById("dataRealizacao").value = reg.data_realizacao;
  document.getElementById("local").value = reg.local;
  document.getElementById("tipoAcao").value = reg.tipo_acao;
  document.getElementById("duracao").value = reg.duracao;
  document.getElementById("departamento").value = reg.departamento;
  document.getElementById("responsavel").value = reg.responsavel;
  document.getElementById("modalidade").value = reg.modalidade;
  document.getElementById("pat").value = reg.pat;
  document.getElementById("participantes").value = reg.participantes;

  document.querySelector("#formTreinamento button[type='submit']").onclick = (e) => atualizar(e, id);
}

// === ATUALIZAR ===
async function atualizar(event, id){
  event.preventDefault();
  const dados = {
    empresa: empresa.value,
    tema: tema.value,
    realizado: realizado.value,
    dataRealizacao: dataRealizacao.value,
    local: local.value,
    tipoAcao: tipoAcao.value,
    duracao: duracao.value,
    departamento: departamento.value,
    responsavel: responsavel.value,
    modalidade: modalidade.value,
    pat: pat.value,
    participantes: participantes.value
  };

  const resp = await fetch(`${API}/${id}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(dados)
  });
  const resultado = await resp.json();
  alert(resultado.mensagem);
  if(resultado.sucesso){
    fecharFormulario();
    carregarTabela();
  }
}

// === EXCLUIR ===
async function excluir(id){
  if(!confirm("Tem certeza que deseja excluir este registro?")) return;
  const resp = await fetch(`${API}/${id}`, { method: "DELETE" });
  const resultado = await resp.json();
  alert(resultado.mensagem);
  if(resultado.sucesso) carregarTabela();
}

carregarEmpresas();
carregarTabela();

// === CARREGAR EMPRESAS DO BANCO ===
async function carregarEmpresas() {
  try {
    const response = await fetch('/empresas');
    const data = await response.json();

    if (data.empresas && Array.isArray(data.empresas)) {
      const select = document.getElementById('empresa');
      select.innerHTML = '<option value="">Selecione a empresa...</option>';
      data.empresas.forEach(emp => {
        const option = document.createElement('option');
        option.value = emp.nome_fantasia;
        option.textContent = emp.nome_fantasia;
        select.appendChild(option);
      });
    } else {
      console.error('Nenhuma empresa encontrada.');
    }
  } catch (error) {
    console.error('Erro ao carregar empresas:', error);
  }
}

</script>

</body>
</html>
