<style>
/* 🔹 Ajuste principal — antes estava position: NONE; */
.overlay {
  position: fixed; /* ✅ Fica fixo sobre toda a tela */
  inset: 0;
  display: none; /* começa escondido */
  justify-content: center;
  align-items: center;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px);
  z-index: 9999; /* bem acima de tudo */
  animation: fadeIn 0.3s ease;
}

.overlay.active {
  display: flex;
}

.overlay.mostrar { display: flex; }

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  background: #fff;
  padding: 25px 30px;
  border-radius: 10px;
  width: 400px;
  max-width: 90%;
  z-index: 10000; /* acima do overlay */
  position: relative;
  box-shadow: 0 0 25px rgba(0,0,0,0.2);
}

.modal-content {
  background: #fff;
  padding: 25px;
  border-radius: 10px;
  width: 400px;
  max-width: 90%;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  position: relative;
  animation: fadeIn 0.3s ease;
}

.modal-content h2 {
  color: #656565;
  text-align: center;
  margin-bottom: 15px;
}

.modal-content label {
  display: block;
  margin-top: 10px;
  font-weight: 600;
  color: #333;
}

.modal-content input,
.modal-content textarea {
  width: 100%;
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
  margin-top: 5px;
}

.close {
  position: absolute;
  top: 10px; right: 15px;
  font-size: 24px;
  color: #555;
  cursor: pointer;
}

@keyframes fadeIn {
  from {opacity: 0; transform: scale(0.95);}
  to {opacity: 1; transform: scale(1);}
}
</style>

</head>
