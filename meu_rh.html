<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu RH</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/static/css/style.css">

<style>
</style>

</head>
<body>
<aside>
  <div>
    <div class="logo">
      <img src="/static/image/LogoGenesis-Lotus2.png" alt="Genesis Lotus" class="logo-img">
    </div>
    <h4>Olá, <span id="usuarioLogado"></span></p></h4   >
    <nav>
      <a href="inicio"><i class="fa-solid fa-chart-line"></i> Início</a>
      <a href="indicadores"><i class="fa-solid fa-bullseye"></i> Indicadores</a>
      <a href="meu_rh" class="active"><i class="fa-solid fa-puzzle-piece"></i> Meu RH</a>
      <a href="meu_rh_acoes_treinamentos"><i class="fa-solid fa-chalkboard-teacher"></i> Ações e Treinamentos</a>
      <a href="meu_rh_avaliacao_experiencia"><i class="fa-solid fa-book-open"></i> Avaliação de Experiência</a>
      <a href="meu_rh_requisicao_pessoal"><i class="fa-solid fa-chalkboard-teacher"></i> Requisições de Pessoal</a>
      <a href="meu_rh_entrevista_desligamento"><i class="fa-solid fa-chalkboard-teacher"></i> Entrevista de Desligamento</a>
    </nav>
  </div>
  <footer style="text-align:center; font-size:0.8rem; opacity:0.8;">
    <div class="logo">
      <img src="/static/image/Genesis1.png" alt="Genesis Lotus" class="logo-img">
    </div>
    <h4>© 2025 Genesis Lotus</h4>
  </footer>
</aside>

<main>
  <header>
    <h1>Meu RH</h1>
    <select id="selectUnidade" class="btn" style="padding: 9px 14px;">
      <option value="">Selecione a Unidade</option>
    </select>
    <button class="btn" onclick="sair()">Sair</button>
  </header>

  <div class="cards">
    <div class="card">
      <p>Ações</p>
      <h2 id="totalAcoes">0</h2>
    </div>
    <div class="card">
      <p>Treinamentos</p>
      <h2 id="totalTreinamentos">0</h2>
    </div>
    <div class="card">
      <p>Requisição de Pessoas</p>
      <h2 id="totalRequisicoes">0</h2>
    </div>
    <div class="card">
      <p>Avaliações de Experiência</p>
      <h2 id="totalAvaliacoes">0</h2>
    </div>
    <div class="card">
      <p>Entrevista Desligamento</p>
      <h2 id="totalAvaliacoes">0</h2>
    </div>
  </div>

</main>

<script>

const usuarioLogado = JSON.parse(localStorage.getItem("usuarioLogado"));
document.getElementById("usuarioLogado").innerText = usuarioLogado?.nome || ""; 

function sair() {
  localStorage.removeItem('usuarioLogado');
  window.location.href = '/';
}

async function carregarTotais() {
  const unidadeSelecionada = JSON.parse(localStorage.getItem('unidadeSelecionada'));
  const empresaId = unidadeSelecionada?.nome || '';

  try {
    const resp = await fetch(`/api/totais?empresa_id=${empresaId}`);
    const dados = await resp.json();

    if (dados.sucesso) {
      const t = dados.totais;
      document.getElementById('totalAcoes').textContent = t.acoes;
      document.getElementById('totalTreinamentos').textContent = t.treinamentos;
      document.getElementById('totalRequisicoes').textContent = t.requisicoes;
      document.getElementById('totalAvaliacoes').textContent = t.avaliacoes;
      document.getElementById('TotalEntrevista').textContent = t.entrevista;
    } else {
      console.error("Erro ao carregar totais:", dados.mensagem);
    }
  } catch (err) {
    console.error("Erro de conexão:", err);
  }
}

async function carregarUnidades() {
  try {
    const resp = await fetch(`/api/unidades_permitidas?usuario_id=${usuarioLogado.id}`);
    const dados = await resp.json();
    const select = document.getElementById('selectUnidade');

    if (dados.sucesso) {
      select.innerHTML = '';

      dados.unidades.forEach(u => {
        const nomes = u.nome.split(";").map(n => n.trim()).filter(n => n !== "");
        nomes.forEach(nome => {
          const opt = document.createElement("option");
          opt.value = u.id;
          opt.textContent = nome;
          select.appendChild(opt);
        });
      });

      const unidadeSalva = JSON.parse(localStorage.getItem('unidadeSelecionada'));

      if (unidadeSalva && dados.unidades.some(u => u.id == unidadeSalva.nome)) {
        select.value = unidadeSalva.id;
      } else {
        if (dados.unidades.length > 0) {
          const primeira = dados.unidades[0];
          localStorage.setItem('unidadeSelecionada', JSON.stringify(primeira));
          select.value = primeira.id;
        }
      }

      carregarTotais();
    }
  } catch (err) {
    console.error("Erro ao carregar unidades:", err);
  }
}

document.getElementById('selectUnidade').addEventListener('change', (e) => {
  const select = e.target;
  const id = select.value;
  const nome = select.options[select.selectedIndex].text;
  if (id) {
    localStorage.setItem('unidadeSelecionada', JSON.stringify({ id, nome }));
    carregarTotais();
  }
});

carregarTotais();
carregarUnidades();
</script>
</body>
</html>
