<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesis Lotus - Dashboard</title>

<link rel="stylesheet" href="/static/css/style.css">

<style>
    .logo { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 30px; color: #fff; }
    .btn { background-color: #fff; color: #0E3E98; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.3s; }
    .btn:hover { background-color: #0D187D; color: #fff; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card { background-color: #0D187D; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .card h2 { font-size: 2rem; margin: 10px 0; }    
</style>

</head>
<body>
<aside>
  <div>
    <div class="logo">GENESIS LOTUS</div>
    <nav>
      <a href="inicio" class="active"><i class="fa-solid fa-chart-line"></i> Início</a>
      <a href="usuario"><i class="fa-solid fa-bullseye"></i> Usuário</a>
      <a href="empresa"><i class="fa-solid fa-bullseye"></i> Empresa</a>
    </nav>
  </div>
  <footer style="text-align:center; font-size:0.8rem; opacity:0.8;">© 2025 Genesis Lotus</footer>
</aside>

<main>
  <header>
    <h1>Visão Geral</h1>
    <button class="btn" onclick="sair()">Sair</button>
  </header>

  <div class="cards">
    <div class="card">
      <p>Total de Usuários</p>
      <h2 id="totalUsuarios">0</h2>
    </div>
    <div class="card">
      <p>Total de Indicadores</p>
      <h2 id="totalIndicadores">0</h2>
    </div>
    <div class="card">
      <p>Total de Clientes Ativos</p>
      <h2 id="totalClientes">0</h2>
    </div>
    <div class="card">
      <p>Total de Ações e Treinamentos</p>
      <h2 id="totalAcoesTreinamentos">0</h2>
    </div>
    <div class="card">
      <p>Total de Requisições de Pessoal</p>
      <h2 id="totalRequisicoes">0</h2>
    </div>
    <div class="card">
      <p>Total de Avaliações de Experiência</p>
      <h2 id="totalAvaliacoes">0</h2>
    </div>
  </div>

  <canvas id="graficoIndicadores"></canvas>
</main>

<script>
function sair() {
  localStorage.removeItem('usuarioLogado');
  window.location.href = '/';
}

document.addEventListener("DOMContentLoaded", () => {
  const usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
  const indicadores = JSON.parse(localStorage.getItem('indicadores') || '[]');
  const empresas = JSON.parse(localStorage.getItem('empresas') || '[]');
  const acoesTreinamentos = JSON.parse(localStorage.getItem('acoesTreinamentos') || '[]');
  const requisicoes = JSON.parse(localStorage.getItem('requisicoesPessoal') || '[]');
  const avaliacoes = JSON.parse(localStorage.getItem('avaliacoes') || '[]');

  // Totais
  document.getElementById('totalUsuarios').textContent = usuarios.length;
  document.getElementById('totalIndicadores').textContent = indicadores.length;
  document.getElementById('totalClientes').textContent = empresas.filter(e => e.status === "Ativo").length;
  document.getElementById('totalAcoesTreinamentos').textContent = acoesTreinamentos.length;
  document.getElementById('totalRequisicoes').textContent = requisicoes.length;
  document.getElementById('totalAvaliacoes').textContent = avaliacoes.length;

  
  });

</script>
</body>
</html>
