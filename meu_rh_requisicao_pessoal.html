  <!DOCTYPE html>
  <html lang="pt-br">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Requisições de Pessoal</title>
  <link rel="icon" type="image/png" href="/static/image/LogoGenesis-Lotus2.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css">

  <style>
    /* Fundo escurecido ao abrir o formulário */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    /* Container do formulário */
    .form-popup {
      background-color: #fff;
      padding: 25px 30px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      animation: fadeIn 0.3s ease-in-out;
    }

    /* Título */
    .form-popup h2 {
      text-align: center;
      color: #0D187D;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    /* Campos do formulário */
    .form-popup input,
    .form-popup textarea,
    .form-popup select {
      width: 100%;
      padding: 10px 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: 0.2s;
    }

    /* Foco no campo */
    .form-popup input:focus,
    .form-popup textarea:focus,
    .form-popup select:focus {
      border-color: #0D187D;
      outline: none;
      box-shadow: 0 0 5px rgba(13,24,125,0.3);
    }

    /* Botões do formulário */
    .form-popup .btn {
      width: 48%;
      margin: 10px 1%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: #0D187D;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .form-popup .btn:hover {
      background-color: #0E3E98;
    }

    /* Animação de entrada suave */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    small {
      color: black;
    }
  </style>
  </head>
  <body>
    <aside>
      <div>
        <div class="logo">
          <img src="/static/image/LogoGenesis-Lotus2.png" alt="Genesis Lotus" class="logo-img">
        </div>
        <h4>Olá, <span id="usuarioLogado"></span></p></h4   >
        <nav>
          <a href="inicio"><i class="fa-solid fa-chart-line"></i> Início</a>
          <a href="indicadores"><i class="fa-solid fa-bullseye"></i> Indicadores</a>
          <a href="meu_rh"><i class="fa-solid fa-puzzle-piece"></i> Meu RH</a>
          <a href="meu_rh_acoes_treinamentos"><i class="fa-solid fa-chalkboard-teacher"></i> Ações e Treinamentos</a>
          <a href="meu_rh_avaliacao_experiencia"><i class="fa-solid fa-book-open"></i> Avaliação de Experiência</a>
          <a href="meu_rh_requisicao_pessoal" class="active"><i class="fa-solid fa-chalkboard-teacher"></i> Requisições de Pessoal</a>
          <a href="meu_rh_processo_seletivo"><i class="fa-solid fa-chalkboard-teacher"></i> Processo Seletivo</a>
          <a href="meu_rh_entrevista_desligamento"><i class="fa-solid fa-chalkboard-teacher"></i> Entrevista de Desligamento</a>
        </nav>
      </div>
      <footer style="text-align:center; font-size:0.8rem; opacity:0.8;">
        <div class="logo">
          <img src="/static/image/Genesis1.png" alt="Genesis Lotus" class="logo-img">
        </div>
        <h4>© 2025 Genesis Lotus</h4>
      </footer>
    </aside>

    <main>
      <header>
        <h1>Requisições de Pessoal</h1>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <button class="btn" onclick="abrirFormulario()">Nova Requisição</button>
          <button class="btn" onclick="exportarTabela()">Exportar</button>
          <select id="selectUnidade" class="btn" style="padding: 9px 14px;" onclick="carregarTabela()">
            <option value="">Selecione a Unidade</option>
          </select>
          <button class="btn" onclick="sair()">Sair</button>
        </div>
      </header>

      <section>
        <div class="filters">
          <label>Mês:</label>
          <select id="filtroMes" class="btn">
            <option value="">Todos</option>
            <option value="01">Janeiro</option>
            <option value="02">Fevereiro</option>
            <option value="03">Março</option>
            <option value="04">Abril</option>
            <option value="05">Maio</option>
            <option value="06">Junho</option>
            <option value="07">Julho</option>
            <option value="08">Agosto</option>
            <option value="09">Setembro</option>
            <option value="10">Outubro</option>
            <option value="11">Novembro</option>
            <option value="12">Dezembro</option>
          </select>

          <label>Ano:</label>
          <input type="number" class="btn" id="filtroAno" placeholder="Ano" style="width:100px">

          <select id="filtroStatus" class="btn" style="padding:9px 12px;">
            <option value="">Todos os Status</option>
            <option value="Pendente">Pendente</option>
            <option value="Em análise">Em análise</option>
            <option value="Aprovada">Aprovada</option>
            <option value="Rejeitada">Rejeitada</option>
            <option value="Concluída">Concluída</option>
          </select>

          <button class="btn" onclick="carregarTabela()">Filtrar</button>
        </div>

        <div id="tabelaRequisicoes"></div>
      </section>
    </main>

    <!-- Modal de cadastro -->
    <div id="form-popup" class="overlay" style="display:none;">
      <div class="form-popup">
        <form id="formRequisicao" onsubmit="salvarRequisicao(event)">
          <h2 id="tituloForm">Nova Requisição</h2>

            
            <div style="flex:1;">
              <label class="logo">Dados da vaga</label></p>
              <label class="logo">Tipo de Requisição</label>
              <select id="tipo_requisicao" required>
                <option value="Nova vaga">Nova vaga</option>
                <option value="Substituição">Substituição</option>
                <option value="Temporário">Temporário</option>
                <option value="Estágio">Estágio</option>
                <option value="Terceirizado">Terceirizado</option>
              </select>

              <label class="logo">Título do Cargo</label>
              <input type="text" id="titulo_cargo" required>

              <label class="logo">Área / Setor</label>
              <input type="text" id="area_setor">

              <label class="logo">Quantidade</label>
              <input type="number" id="quantidade" value="1" min="1">

              

              <label class="logo">Faixa salarial</label>
              <input type="text" id="faixa_salarial">

              <label class="logo">Tipo de contrato</label>
              <select id="tipo_contrato">
                <option value="CLT">CLT</option>
                <option value="PJ">PJ</option>
                <option value="Estágio">Estágio</option>
                <option value="Temporário">Temporário</option>
              </select>
              
              <label class="logo">Motivo</label>
              <input type="text" id="motivo">
              <label class="logo">Formação exigida</label>
              <input type="text" id="formacao_exigida">

              <label class="logo">Experiência mínima</label>
              <input type="text" id="experiencia_minima">

              <label class="logo">Competências técnicas</label>
              <textarea id="competencias_tecnicas" rows="2"></textarea>

              <label class="logo">Competências comportamentais</label>
              <textarea id="competencias_comportamentais" rows="4" style="
                width: 100%;
                padding: 12px;
                border: 1px solid #ccc;
                border-radius: 8px;
                resize: vertical;
              " required></textarea>

              <label class="logo">Observações</label>
              <textarea id="observacoes" rows="2"></textarea>

          
        
              <label class="logo">Dados do solicitante</label></p>
              <label class="logo">Solicitante - Nome</label>
              <input type="text" id="solicitante_nome" required>

              <label class="logo">Solicitante - Cargo</label>
              <input type="text" id="solicitante_cargo">

              <label class="logo">Departamento</label>
              <input type="text" id="departamento">

              <label class="logo">Colaborador Substituído (se houver)</label>
              <input type="text" id="colaborador_substituido">

              <label class="logo">Responsável RH</label>
              <input type="text" id="responsavel_rh">
            </div>



            <div style="flex:1;">

              <label class="logo">Urgência</label>
              <select id="urgencia">
                <option value="Baixa">Baixa</option>
                <option value="Média" selected>Média</option>
                <option value="Alta">Alta</option>
              </select>

            </div>

            <div style="flex:1;">

              <label class="logo">Prazo desejado (data)</label>
              <input type="date" id="prazo_desejado">

            </div>

            <div style="flex:1;">

              <label class="logo">Contratação (data)</label>
              <input type="date" id="data_contratacao">

            </div>

            <div style="flex:1;">

            <label class="logo">Status</label>
              <select id="status" disabled>
                <option value="Pendente">Pendente</option>
                <option value="Em análise">Em análise</option>
                <option value="Aprovada">Aprovada</option>
                <option value="Rejeitada">Rejeitada</option>
                <option value="Concluída">Concluída</option>
              </select>


          </div>
          
          

          <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:10px;">
            <button type="submit" class="btn">Salvar</button>
            <button type="button" class="btn" onclick="fecharFormulario()">Fechar</button>
          </div>
        </div>

        </form>
      </div>
    </div>

  <!-- Importação da biblioteca XLSX (necessária para exportar Excel) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <div id="toast-container"></div>

  <script src="/static/js/meu_rh_requisicao_pessoal.js"></script>

  </body>
  </html>
