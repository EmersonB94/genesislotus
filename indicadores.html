<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genesis Lotus - Indicadores</title>

<link rel="stylesheet" href="css/style.css">

<style>
body { display: flex; min-height: 100vh; background-color: #0E3E98; color: #fff; font-family: 'Poppins', sans-serif; }
aside { width: 250px; background-color: #0D187D; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
.logo { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 30px; color: #fff; }
nav a { display: block; color: #fff; text-decoration: none; padding: 12px 15px; border-radius: 8px; margin-bottom: 8px; transition: background 0.3s; }
nav a:hover, nav a.active { background-color: #0E3E98; }
main { flex: 1; padding: 30px; background-color: #acafb3; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 10px; }
header h1 { font-size: 1.5rem; font-weight: 600; }
.buttons { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button { background-color: #fff; color: #0E3E98; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; }
button:hover { background-color: #0D187D; color: #fff; }
form { background: #484c72; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 400px; display: none; z-index: 10; }
form.mostrar { display: block; }
input, select, textarea { width: 100%; margin-bottom: 10px; padding: 8px; border: none; border-radius: 5px; }
table { width: 100%; margin-top: 20px; border-collapse: collapse; background: #0D187D; border-radius: 10px; overflow: hidden; }
th, td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.2); }
th { background-color: #0D187D; color: #fff; }
.overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 5; }
#perfilModal { background: #0D187D; padding: 20px; border-radius: 10px; width: 300px; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; z-index: 20; }
</style>
</head>
<body>
<aside>
  <div>
    <div class="logo">GENESIS LOTUS</div>
    <p>Bem-vindo, <span id="usuarioLogado"></span>!</p>
    <nav>
      <a href="inicio"><i class="fa-solid fa-chart-line"></i> Início</a>
      <a href="indicadores" class="active"><i class="fa-solid fa-chart-line"></i> Indicadores</a>
    </nav>
  </div>
</aside>

<main>
  <header>
    <h1>Gestão de Indicadores</h1>
    <div class="buttons">
      <button onclick="mostrarPerfil()">Perfil</button>
      <button id="btnNovoRegistro" onclick="mostrarFormulario()">Novo Registro</button>
      <button onclick="gerarPDF()">Relatório</button>
      <button onclick="exportarExcel()">Exportar</button>
      <button onclick="importarExcel()">Importar</button>
      <button onclick="sair()">Sair</button>
    </div>
  </header>

  <div id="perfilModal">
    <h3>Perfil do Usuário</h3>
    <p><strong>Nome:</strong> <span id="perfilNome">-</span></p>
    <p><strong>Cargo:</strong> <span id="perfilCargo">-</span></p>
    <button onclick="fecharPerfil()">Fechar</button>
  </div>

  <div class="overlay" id="overlay" onclick="fecharFormulario()"></div>

  <!-- === FORMULÁRIO DE REGISTRO === -->
  <form id="formIndicadores">
    <h3>Registro</h3>

    <label>Indicador:</label>
    <input type="text" id="nome" placeholder="Nome do Indicador" required>

    <label>Mês:</label>
    <input type="text" id="mes" placeholder="Janeiro" required>

    <label>Ano:</label>
    <input type="number" id="ano" placeholder="2025" required>

    <label>Prazo:</label>
    <input type="date" id="prazo" required>

    <label>Ação Corretiva:</label>
    <textarea id="acao_corretiva" rows="2"></textarea>

    <label>Análise Crítica:</label>
    <textarea id="analise_critica" rows="2"></textarea>

    <label>Status:</label>
    <select id="status" required>
      <option value="Pendente">Pendente</option>
      <option value="Em desenvolvimento">Em desenvolvimento</option>
      <option value="Realizado">Realizado</option>
    </select>

    <label>Resultado:</label>
    <input type="text" id="resultado" placeholder="Ex: 85%">

    <button type="submit" id="btnSalvar">Salvar</button>
  </form>

  <!-- === FILTROS === -->
  <div>
    <label>Filtro Empresa:</label>
    <select id="filtroEmpresa"></select>

    <label>Indicador:</label>
    <select id="filtroTipo">
      <option value="">Todos</option>
      <option value="Absenteísmo">Absenteísmo</option>
      <option value="Turnover">Turnover</option>
    </select>

    <label>Ano:</label>
    <input type="number" id="filtroAno" placeholder="2025">
    <button onclick="filtrarTabela()">Filtrar</button>
  </div>

<h2>Indicadores</h2>
<button id="btnNovoIndicador">+ Novo Registro</button>

<!-- FORMULÁRIO -->
<div id="formContainer" style="display:none; margin-top:20px;">
  <form id="formIndicador">
    <label>Nome:</label>
    <input type="text" id="nome" required><br><br>

    <label>Meta:</label>
    <input type="number" id="meta" step="0.01" required><br><br>

    <label>Resultado:</label>
    <input type="number" id="resultado" step="0.01" required><br><br>

    <label>Responsável:</label>
    <input type="text" id="responsavel" required><br><br>

    <button id="btnSalvar" type="submit">Salvar</button>
  </form>
</div>

<!-- TABELA -->
<table id="tabelaIndicadores" border="1" style="margin-top:20px; width:100%;">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nome</th>
      <th>Meta</th>
      <th>Resultado</th>
      <th>Responsável</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>


<!-- Importar JS -->
<script src="js/indicadores.js"></script>


  <!-- === TABELA === -->
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Indicador</th>
        <th>Mês</th>
        <th>Ano</th>
