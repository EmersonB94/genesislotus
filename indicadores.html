<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indicadores</title>
<link rel="icon" type="image/png" href="/static/image/LogoGenesis-Lotus2.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/static/css/style.css">

<style>
/* 🔹 Estilo modal completo (seu padrão ajustado) */
.overlay {
  position: fixed;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px);
  z-index: 9999;
  animation: fadeIn 0.3s ease;
}
.overlay.mostrar { display: flex; }

@keyframes fadeIn {
  from {opacity: 0; transform: scale(0.95);}
  to {opacity: 1; transform: scale(1);}
}

.modal {
  background: #fff;
  padding: 25px 30px;
  border-radius: 10px;
  width: 400px;
  max-width: 90%;
  z-index: 10000;
  position: relative;
  box-shadow: 0 0 25px rgba(0,0,0,0.2);
  animation: fadeIn 0.3s ease;
}

.modal h3 {
  color: #656565;
  text-align: center;
  margin-bottom: 15px;
}

.modal label {
  display: block;
  margin-top: 10px;
  font-weight: 600;
  color: #333;
}

.modal input,
.modal textarea,
.modal select {
  width: 100%;
  padding: 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
  margin-top: 5px;
}

.close {
  position: absolute;
  top: 10px; right: 15px;
  font-size: 24px;
  color: #555;
  cursor: pointer;
}
</style>
</head>

<body>
<aside>
  <div>
    <div class="logo">
      <img src="/static/image/LogoGenesis-Lotus2.png" alt="Genesis Lotus" class="logo-img">
    </div>
    <h4>Olá, <span id="usuarioLogado"></span></p></h4>
    <nav>
      <a href="inicio"><i class="fa-solid fa-chart-line"></i> Início</a>
      <a href="indicadores" class="active"><i class="fa-solid fa-bullseye"></i> Indicadores</a>
    </nav>
  </div>
  <footer style="text-align:center; font-size:0.8rem; opacity:0.8;">
    <div class="logo">
      <img src="/static/image/Genesis1.png" alt="Genesis Lotus" class="logo-img">
    </div>
    <h4>© 2025 Genesis Lotus</h4>
  </footer>
</aside>

<main>
  <header>
    <h1>Gestão de Indicadores</h1>
    <div style="display: flex; align-items: center; gap: 10px;">
      <button class="btn" onclick="abrirFormulario()"><i class="fa-solid fa-plus"></i> Novo Registro</button>
      <button class="btn" onclick="exportarTabela()"><i class="fa-solid fa-file-export"></i> Exportar</button>
      <select id="selectUnidade" class="btn" style="padding: 9px 14px;">
        <option value="">Selecione a Unidade</option>
      </select>
      <button class="btn" onclick="sair()">Sair</button>
    </div>
  </header>

  <!-- FILTROS -->
  <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
    <select class="btn" id="filtroIndicador" style="padding: 8px; border-radius: 6px;">
      <option value="">Todos os Indicadores</option>
    </select>
    <select class="btn" id="filtroMes" style="padding: 8px; border-radius: 6px;">
      <option value="">Todos os Meses</option>
      <option>Janeiro</option><option>Fevereiro</option><option>Março</option>
      <option>Abril</option><option>Maio</option><option>Junho</option>
      <option>Julho</option><option>Agosto</option><option>Setembro</option>
      <option>Outubro</option><option>Novembro</option><option>Dezembro</option>
    </select>
    <input class="btn" type="number" id="filtroAno" placeholder="Ano" style="padding: 8px; border-radius: 6px; width: 100px;">
    <button class="btn" onclick="carregarIndicadores()"><i class="fa-solid fa-filter"></i> Filtrar</button>
  </div>

  <!-- 🔧 FORMULÁRIO MODAL -->
  <div class="overlay" id="overlay">
    <div class="modal" id="formContainer" onclick="event.stopPropagation()">
      <span class="close" onclick="fecharFormulario()">&times;</span>
      <h3 id="tituloForm">Novo Indicador</h3>
      <form id="formIndicador">
        <input type="hidden" id="id">
        <label>Indicador:</label>
        <!-- <input type="text" id="SelectIndicador" required> -->
        <select id="SelectIndicador" style="padding: 9px 14px;" required>
          <option value="">Selecione o indicador</option>
        </select>
        <label>Mês:</label>
        <input type="text" id="mes" required>
        <label>Ano:</label>
        <input type="number" id="ano" required>
        <label>Valor:</label>
        <input type="text" id="valor" placeholder="Ex: 85%">
        <label>Análise Crítica:</label>
        <textarea id="analise_critica" rows="2"></textarea>
        <label>Ação Corretiva:</label>
        <textarea id="acao_corretiva" rows="2"></textarea>
        <label>Prazo:</label>
        <input type="date" id="prazo">
        <label>Status:</label>
        <select id="status">
          <option value="Pendente">Pendente</option>
          <option value="Em desenvolvimento">Em desenvolvimento</option>
          <option value="Realizado">Realizado</option>
          <option value="Vencido e não aplicado">Ação vencida</option>
        </select>
        <br><br>
        <button class="btn" type="submit">Salvar</button>
        <button class="btn" type="button" onclick="fecharFormulario()">Cancelar</button>
      </form>
    </div>
  </div>
  <!-- 🔧 FIM DO FORMULÁRIO MODAL -->

  <!-- TABELA -->
  <table id="tabelaIndicadores">
    <thead>
      <tr>
        <th>ID</th>
        <th>Empresa</th>
        <th>Indicador</th>
        <th>Mês</th>
        <th>Ano</th>
        <th>Valor</th>
        <th>Análise</th>
        <th>Plano de Ação</th>
        <th>Data Ação</th>
        <th>Status</th>
        <th>Registro</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <div id="overlayContainer"></div>

  <script src="/static/js/indicadores.js"></script>
</body>
</html>
