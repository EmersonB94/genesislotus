  <!DOCTYPE html>
  <html lang="pt-br">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha Colaborador</title>
  <link rel="icon" type="image/png" href="/static/image/LogoGenesis-Lotus2.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css">

  <style>
    /* Fundo escurecido ao abrir o formulário */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    /* Container do formulário */
    .form-popup {
      background-color: #fff;
      padding: 25px 30px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      animation: fadeIn 0.3s ease-in-out;
    }

    /* Título */
    .form-popup h2 {
      text-align: center;
      color: #0D187D;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    /* Campos do formulário */
    .form-popup input,
    .form-popup textarea,
    .form-popup select {
      width: 100%;
      padding: 10px 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: 0.2s;
    }

    /* Foco no campo */
    .form-popup input:focus,
    .form-popup textarea:focus,
    .form-popup select:focus {
      border-color: #0D187D;
      outline: none;
      box-shadow: 0 0 5px rgba(13,24,125,0.3);
    }

    /* Botões do formulário */
    .form-popup .btn {
      width: 48%;
      margin: 10px 1%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: #0D187D;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .form-popup .btn:hover {
      background-color: #0E3E98;
    }

    /* Animação de entrada suave */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

  </style>
  </head>
  <body>
    <aside>
      <div>
        <div class="logo">
          <img src="/static/image/LogoGenesis-Lotus2.png" alt="Genesis Lotus" class="logo-img">
        </div>
        <h4>Olá, <span id="usuarioLogado"></span></p></h4   >
        <nav>
          <a href="inicio"><i class="fa-solid fa-chart-line"></i> Início</a>
          <a href="indicadores"><i class="fa-solid fa-bullseye"></i> Indicadores</a>
          <a href="meu_dp"><i class="fa-solid fa-users"></i> Meu DP</a>
          <a href="meu_dp_cad_colaborador" class="active"><i class="fa-solid fa-chalkboard-teacher"></i> Cadastro de Colaboradores</a>
        </nav>
      </div>
      <footer style="text-align:center; font-size:0.8rem; opacity:0.8;">© 2025 Genesis Lotus</footer>
    </aside>

    <main>
      <header>
        <h1>Cadastro de colaborador</h1>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <button class="btn" onclick="abrirFormulario()">Novo</button>
          <button class="btn" onclick="exportarTabela()">Exportar</button>
          <select id="selectUnidade" class="btn" style="padding: 9px 14px;">
            <option value="">Selecione a Unidade</option>
          </select>
          <button class="btn" onclick="sair()">Sair</button>
        </div>
      </header>

      <section>
        <div class="filters">
          <label>Mês:</label>
          <select id="filtroMes" class="btn">
            <option value="">Todos</option>
            <option value="01">Janeiro</option>
            <option value="02">Fevereiro</option>
            <option value="03">Março</option>
            <option value="04">Abril</option>
            <option value="05">Maio</option>
            <option value="06">Junho</option>
            <option value="07">Julho</option>
            <option value="08">Agosto</option>
            <option value="09">Setembro</option>
            <option value="10">Outubro</option>
            <option value="11">Novembro</option>
            <option value="12">Dezembro</option>
          </select>

          <label>Ano:</label>
          <input type="number" class="btn" id="filtroAno" placeholder="Ano" style="width:100px">

          <select id="filtroStatus" class="btn" style="padding:9px 12px;">
            <option value="">Todos os Status</option>
            <option value="Nova vaga">Em Experiência</option>
            <option value="Substituição">Desligado antes do fim da Experiência (Contratante)</option>
            <option value="Substituição">Desligado antes do fim da Experiência (Colaborador)</option>
            <option value="Substituição">Desligado ao fim da Experiência (Contratante)</option>
            <option value="Substituição">Desligado ao fim da Experiência (Colaborador)</option>
          </select>

          <button class="btn" onclick="carregarTabela()">Filtrar</button>
        </div>

        <div id="tabelaRequisicoes"></div>
      </section>
    </main>

    <!-- Modal de cadastro -->
    <div id="form-popup" class="overlay" style="display:none;">
      <div class="form-popup">
        <form id="formExperiencia" onsubmit="salvarRequisicao(event)">

          <h2 id="tituloForm">Nova Ficha</h2>
          <label class="logo">Ficha cadastral</label></p>

            <fieldset>
                    
              <label class="logo">Dados colaborador</label></p>
                    <label class="logo">Nome</label>
                    <input type="text" id="nome" required>
                    <label class="logo">CPF</label>
                    <input type="text" id="cpf" required>
                    <label class="logo">Contato</label>
                    <input type="text" id="contato" required>
                    <label class="logo">E-mail Pessoal</label>
                    <input type="email" id="emailpessoal">
                    
                    <label class="logo">Nascimento</label>
                    <input type="date" id="dtnascimento" required>
                    <select id="sexo" required>
                      <option value="Masculino">Masculino</option>
                      <option value="Feminino">Feminino</option>
                      <option value="Não Informado">Não informado</option>
                    </select>
                    <label class="logo">Filhos</label>
                    <input type="text" id="filhos" required>
                    <label class="logo">Cidade</label>
                    <input type="text" id="cidade" required>
                    <label class="logo">Estado</label>
                    <input type="text" id="estado" required>

                  <label class="logo">Escolaridade</label></p>
                        <label class="logo">Formação Escolar</label>
                        <select id="formacao_escolar" required>
                            <option value="Não alfabetizado">Não alfabetizado</option>
                            <option value="Contratado">Ensino primário (Incompleto)</option>
                            <option value="Contratado">Ensino primário</option>
                            <option value="Contratado">Ensino Fundamental (Incompleto)</option>
                            <option value="Contratado">Ensino Fundamental</option>
                            <option value="Contratado">Ensino Superior (Incompleto)</option>
                            <option value="Contratado">Ensino Superior</option>
                            <option value="Contratado">Ensino Superior (Cursando)</option>
                            <option value="Contratado">Ensino Superior (Incompleto)</option>
                            <option value="Contratado">Ensino Superior</option>
                        </select> 
                        <label class="logo">Formação superior</label>
                        <input type="text" id="formacao_superior">

            </fieldset>

            <fieldset>

                    <div style="flex:1;">
                        
                        <label class="logo">Empregado</label></p>
                        <label class="logo">Matricula</label>
                        <input type="text" id="matricula">
                        <label class="logo">E-mail Corporativo</label>
                        <input type="email" id="emailprofissional">
                        <label class="logo">Cargo</label>
                        <input type="text" id="cargo" required>
                        <label class="logo">Salário base</label>
                        <input type="text" id="salariobase">
                        <label class="logo">Jornada de trabalho / Carga horária semanal</label>
                        <input type="text" id="ch" required>
                        <label class="logo">Admissão (data)</label>
                        <input type="date" id="dtadmissao" required>
                        <label class="logo">Integração (data)</label>
                        <input type="date" id="dtintegracao">
                        
                        <label class="logo">PCD</label>
                        <select id="pcd" required>
                            <option value="Não se aplica">Não</option>
                            <option value="Deficiência Intelectual">Deficiência Intelectual</option>
                            <option value="Deficiência Física">Deficiência Física</option>
                            <option value="Deficiência Auditiva">Deficiência Auditiva</option>
                            <option value="Deficiência Visual">Deficiência Visual</option>
                            <option value="Deficiência Múltipla">Deficiência Múltipla</option>
                            <option value="Deficiência Psicossocial">Deficiência Psicossocial</option>
                        </select> 
                        <label class="logo">Desligamento (data)</label>
                        <input type="date" id="dtdemissao">
                        <label class="logo">Motivo de desligamento</label>
                        <select id="motivo_desligamento">
                            <option value="Acordo entre as partes">Acordo entre as partes</option>
                            <option value="Dispensa sem justa causa">Dispensa SEM justa causa</option>
                            <option value="Dispensa com justa causa">Dispensa COM justa causa</option>
                            <option value="Pedido de Dispensa">Pedido de Dispensa</option>
                            <option value="Término de contrato de experiência">Término de contrato de experiência</option>
                            <option value="Encerramento antecipado de contrato (Empregador)">Encerramento antecipado de contrato (Empregador)</option>
                            <option value="Encerramento antecipado de contrato (Empregado)">Encerramento antecipado de contrato (Empregado)</option>
                        </select> 
                        <label class="logo">Status</label>
                        <select id="status" required>
                            <option value="1. Em Experiência">Em Experiência</option>
                            <option value="2. Contratado">Contratado</option>
                            <option value="3. Licença Maternidade">Licença Maternidade</option>
                            <option value="4. Licença INSS">Licença INSS</option>
                            <option value="5. Férias">Férias</option>
                            <option value="6. Desligado">Desligado</option>
                        </select> 
                
                    </div>
          </fieldset>
          
          <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:10px;">
            <button type="submit" class="btn">Salvar</button>
            <button type="button" class="btn" onclick="fecharFormulario()">Fechar</button>
          </div>

        </form>
      </div>
    </div>

  <!-- Importação da biblioteca XLSX (necessária para exportar Excel) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <div id="toast-container"></div>

  <script src="/static/js/meu_dp_cad_colaborador.js"></script>

  </body>
  </html>
