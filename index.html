<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genesis Lotus - Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background-color: #0E3E98;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;  
      height: 100vh;
      margin: 0;
      min-height: 100vh;

      /*
      min-height: 100vh;
      color: #fff;
      font-family: 'Poppins', sans-serif;*/

      /* background-image: url('static/image/fundo.png'); */
      background-image: url('static/image/BACKGROUND-GENESIS3.png');
      background-size: cover;        /* Faz a imagem cobrir toda a tela */
      background-position: center;   /* Centraliza a imagem */
      background-repeat: no-repeat;  /* Evita que a imagem se repita */

    }

    .login-container {
      background: white;
      color: #000;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      width: 320px;
      text-align: center;
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background-color: #0E3E98;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #0D187D;
    }
    .forgot {
      margin-top: 10px;
      color: #0E3E98;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .forgot:hover {
      text-decoration: underline;
    }
    /* Modal */
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .popup {
      background: white;
      color: black;
      padding: 25px;
      border-radius: 8px;
      width: 300px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Genesis Lotus</h2>
    <input type="email" id="email" placeholder="E-mail" required>
    <input type="password" id="senha" placeholder="Senha" required>
    <button onclick="login()">Entrar</button>
    <div class="forgot" onclick="abrirEsqueciSenha()">Esqueci minha senha</div>
  </div>

  <div id="overlayContainer"></div>

  <script>
    async function login(){
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value.trim();
      if(!email || !senha){
        alert("Preencha e-mail e senha!");
        return;
      }

      //const resp = await fetch("http://localhost:5000/login", {
      const baseURL = window.location.origin + "/genesislotus";
      

      const resp = await fetch(`login`, {

      

      //const resp = await fetch("/genesislotus/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, senha })
      });


      const data = await resp.json();

      if(data.sucesso){
        localStorage.setItem("usuarioLogado", JSON.stringify(data.usuario));
        window.location.href = "/genesislotus/inicio";
      } else {
        alert(data.mensagem);
      } 


    }

    // === Esqueci minha senha ===
    function abrirEsqueciSenha(){
      const overlay = document.getElementById("overlayContainer");
      overlay.innerHTML = `
        <div class="overlay">
          <div class="popup">
            <h3>Recuperar senha</h3>
            <p>Informe seu e-mail cadastrado:</p>
            <input type="email" id="emailRecuperacao" placeholder="Seu e-mail">
            <button onclick="enviarRecuperacao()">Enviar</button>
            <button style="background:#ccc; color:#000; margin-top:8px;" onclick="fecharModal()">Fechar</button>
          </div>
        </div>
      `;
    }

    function fecharModal(){
      document.getElementById("overlayContainer").innerHTML = "";
    }

    async function enviarRecuperacao(){
      const email = document.getElementById("emailRecuperacao").value.trim();
      if(!email){
        alert("Informe seu e-mail.");
        return;
      }

      const baseURL = window.location.origin + "/genesislotus";
      const resp = await fetch(`${baseURL}/esqueci_senha`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ email })
      });

      const data = await resp.json();
      alert(data.mensagem);
      fecharModal();
    }
  </script>
</body>
</html>
