<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Genesis Lotus</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0E3E98;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            text-align: center;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }
        h2 {
            color: #0E3E98;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 95%;
            background-color: #0E3E98;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0D187D;
        }
        .mensagem {
            margin-top: 10px;
            color: red;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>GENESIS LOTUS</h2>
        <form id="formLogin">
            <input type="email" id="email" name="email" placeholder="E-mail" required>
            <input type="password" id="senha" name="senha" placeholder="Senha" required>
            <button type="submit">Entrar</button>
            <button type="button" onclick="window.location.href='/cadastro'">Criar conta</button>
        </form>
        <div id="mensagem" class="mensagem"></div>
    </div>

    <script>
        document.getElementById("formLogin").addEventListener("submit", async function(e) {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email, senha: senha })
                });

                const data = await response.json();
                const msg = document.getElementById("mensagem");

                if (response.ok) {
                    msg.textContent = data.mensagem || "Login realizado com sucesso!";
                    msg.style.color = "green";
                    setTimeout(() => {
                        window.location.href = "/dashboard"; // futura tela principal
                    }, 1000);
                } else {
                    msg.textContent = data.erro || "Usuário ou senha incorretos.";
                    msg.style.color = "red";
                }
            } catch (error) {
                console.error("Erro no login:", error);
                const msg = document.getElementById("mensagem");
                msg.textContent = "Erro de conexão com o servidor.";
                msg.style.color = "red";
            }
        });
    </script>
</body>
</html>
