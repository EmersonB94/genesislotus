<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genesis Lotus</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" type="image/png" href="/static/image/LogoGenesis-Lotus2.png">
  <style>
    body {
      background-color: #0E3E98;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;  
      height: 100vh;
      margin: 0;
      min-height: 100vh;

      /*
      min-height: 100vh;
      color: #fff;
      font-family: 'Poppins', sans-serif;*/

      /* background-image: url('static/image/fundo.png'); */
      background-image: url('static/image/BACKGROUND-GENESIS3.png');
      background-size: cover;        /* Faz a imagem cobrir toda a tela */
      background-position: center;   /* Centraliza a imagem */
      background-repeat: no-repeat;  /* Evita que a imagem se repita */

    }

    .login-container {
      background: white;
      color: #000;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      width: 320px;
      text-align: center;
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background-color: #0E3E98;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #0D187D;
    }
    .forgot {
      margin-top: 10px;
      color: #0E3E98;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .forgot:hover {
      text-decoration: underline;
    }
    /* Modal */
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .popup {
      background: white;
      color: black;
      padding: 25px;
      border-radius: 8px;
      width: 300px;
      text-align: center;
    }

    /* COMANDOS DE ALERTA */

    .toast {
    min-width: 250px;
    padding: 15px 20px;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    animation: slideIn 0.4s ease, fadeOut 0.5s ease 4s forwards;
  }

  .toast-success {
    background-color: #28a745;
  }

  .toast-error {
    background-color: #dc3545;
  }

  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateX(50px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  @keyframes fadeOut {
    to {
      opacity: 0;
      transform: translateX(50px);
    }
  }

  /* Container dos toasts */
  #toast-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Genesis Lotus</h2>
    <input type="email" id="email" placeholder="E-mail" required>
    <input type="password" id="senha" placeholder="Senha" required>
    <button onclick="login()">Entrar</button>
    <div class="forgot" onclick="abrirEsqueciSenha()">Esqueci minha senha</div>
  </div>

  <div id="overlayContainer"></div>

  <script src="/static/js/login.js"></script>
</body>
</html>
