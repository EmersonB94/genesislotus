<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Indicadores</title>
  <link rel="icon" type="image/png" href="/static/image/LogoGenesis-Lotus2.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css">

  <style>
    .filtros {
      margin-bottom: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .filtros input, .filtros select {
      padding: 6px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .filtros button {
      padding: 6px 12px;
    }
    table th, table td { text-align: left; }

    /* ==================== MODAL FLUTUANTE ==================== */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn .2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; } 
      to { opacity: 1; }
    }

    .modal {
      background: #fff;
      padding: 25px;
      width: 450px;
      max-width: 95%;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      position: relative;
      animation: slideDown .25s ease;
    }

    @keyframes slideDown {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal h3 {
      margin: 0 0 15px 0;
      font-size: 1.3rem;
      font-weight: bold;
    }

    .modal form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal input,
    .modal textarea,
    .modal select {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    /* Botão fechar */
    .close-btn {
      position: absolute;
      right: 12px;
      top: 12px;
      background: #ff4d4d;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 18px;
      line-height: 28px;
      text-align: center;
      transition: 0.2s;
    }
    .close-btn:hover {
      background: #e60000;
    }

    /* Botão degrade */
    .btn {
      background: linear-gradient(135deg, #1b4662, #2ba2ef);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }
    .btn:hover {
      filter: brightness(1.15);
    }
  </style>
</head>

<body>
  <aside>
    <div>
      <div class="logo">
        <img src="/static/image/LogoGenesis-Lotus2.png" alt="Genesis Lotus" class="logo-img">
      </div>
      <h4>Olá, <span id="usuarioLogado"></span></p></h4   >
      <nav>
        <a href="inicio"><i class="fa-solid fa-chart-line"></i> Início</a>
        <a onclick="abrirUsuario()"><i class="fa-solid fa-users"></i> Usuários</a>
        <a href="empresa"><i class="fa-solid fa-building"></i> Empresas</a>
        <a href="chamados_admin"><i class="fa-solid fa-headset"></i> Chamados</a>
        <a href="ficha_indicadores" class="active"><i class="fa-solid fa-database"></i> Indicadores</a>
      </nav>
    </div>
    <footer style="text-align:center; font-size:0.8rem; opacity:0.8;">© 2025 Genesis Lotus</footer>
  </aside>

  <main>
    <header>
      <h1><i class="fa-solid fa-database"></i> Cadastro de Indicadores</h1>
      <button class="btn" onclick="abrirForm()"><i class="fa-solid fa-plus"></i> Novo Indicador</button>
      <button class="btn" onclick="sair()"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
    </header>

    <section>
      <div class="filtros">
        <input type="text" id="filtroNome" placeholder="Nome do indicador">
        <select id="filtroSetor">
          <option value="">Setor</option>
          <option>RH</option><option>DP</option><option>SST</option><option>Administrativo</option>
        </select>
        <select id="filtroTipo">
          <option value="">Tipo</option>
          <option>Operacional</option>
          <option>Tático</option>
          <option>Estratégico</option>
        </select>
        <select id="filtroStatus">
          <option value="">Status</option>
          <option>Ativo</option>
          <option>Suspenso</option>
          <option>Inativo</option>
        </select>
        <button onclick="filtrarIndicadores()"><i class="fa-solid fa-filter"></i> Filtrar</button>
      </div>

      <div id="areaTabela"></div>
    </section>
  </main>

  <div id="overlayContainer"></div>

  <script src="/static/js/indicadores_cad.js"></script>

</body>
</html>
