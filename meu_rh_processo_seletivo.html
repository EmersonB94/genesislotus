  <!DOCTYPE html>
  <html lang="pt-br">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processo Seletivo</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css">

  <style>
    /* Fundo escurecido ao abrir o formulário */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    /* Container do formulário */
    .form-popup {
      background-color: #fff;
      padding: 25px 30px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      animation: fadeIn 0.3s ease-in-out;
    }

    /* Título */
    .form-popup h2 {
      text-align: center;
      color: #0D187D;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    /* Campos do formulário */
    .form-popup input,
    .form-popup textarea,
    .form-popup select {
      width: 100%;
      padding: 10px 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: 0.2s;
    }

    /* Foco no campo */
    .form-popup input:focus,
    .form-popup textarea:focus,
    .form-popup select:focus {
      border-color: #0D187D;
      outline: none;
      box-shadow: 0 0 5px rgba(13,24,125,0.3);
    }

    /* Botões do formulário */
    .form-popup .btn {
      width: 48%;
      margin: 10px 1%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: #0D187D;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .form-popup .btn:hover {
      background-color: #0E3E98;
    }

    /* Animação de entrada suave */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    small {
      color: black;
    }
  </style>
  </head>
  <body>
    <aside>
      <div>
        <div class="logo">
          <img src="/static/image/LogoGenesis-Lotus2.png" alt="Genesis Lotus" class="logo-img">
        </div>
        <h4>Olá, <span id="usuarioLogado"></span></p></h4   >
        <nav>
          <a href="inicio"><i class="fa-solid fa-chart-line"></i> Início</a>
          <a href="indicadores"><i class="fa-solid fa-bullseye"></i> Indicadores</a>
          <a href="meu_rh"><i class="fa-solid fa-puzzle-piece"></i> Meu RH</a>
          <a href="meu_rh_acoes_treinamentos"><i class="fa-solid fa-chalkboard-teacher"></i> Ações e Treinamentos</a>
          <a href="meu_rh_avaliacao_experiencia"><i class="fa-solid fa-book-open"></i> Avaliação de Experiência</a>
          <a href="meu_rh_requisicao_pessoal"><i class="fa-solid fa-chalkboard-teacher"></i> Requisições de Pessoal</a>
          <a href="meu_rh_processo_seletivo" class="active"><i class="fa-solid fa-chalkboard-teacher"></i> Processo Seletivo</a>
          <a href="meu_rh_entrevista_desligamento"><i class="fa-solid fa-chalkboard-teacher"></i> Entrevista de Desligamento</a>
        </nav>
      </div>
      <footer style="text-align:center; font-size:0.8rem; opacity:0.8;">
        <div class="logo">
          <img src="/static/image/Genesis1.png" alt="Genesis Lotus" class="logo-img">
        </div>
        <h4>© 2025 Genesis Lotus</h4>
      </footer>
    </aside>

    <main>
      <header>
        <h1>Processo Seletivo</h1>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <button class="btn" onclick="abrirFormulario()">Novo Registro</button>
          <button class="btn" onclick="exportarTabela()">Exportar</button>
          <select id="selectUnidade" class="btn" style="padding: 9px 14px;">
            <option value="">Selecione a Unidade</option>
          </select>
          <button class="btn" onclick="sair()">Sair</button>
        </div>
      </header>

      <section>
        <div class="filters">
          <label>Mês:</label>
          <select id="filtroMes" class="btn">
            <option value="">Todos</option>
            <option value="01">Janeiro</option>
            <option value="02">Fevereiro</option>
            <option value="03">Março</option>
            <option value="04">Abril</option>
            <option value="05">Maio</option>
            <option value="06">Junho</option>
            <option value="07">Julho</option>
            <option value="08">Agosto</option>
            <option value="09">Setembro</option>
            <option value="10">Outubro</option>
            <option value="11">Novembro</option>
            <option value="12">Dezembro</option>
          </select>

          <label>Ano:</label>
          <input type="number" class="btn" id="filtroAno" placeholder="Ano" style="width:100px">

          <select id="filtroStatus" class="btn" style="padding:9px 12px;">
            <option value="">Todos os Status</option>
            <option value="Pendente">Pendente</option>
            <option value="Em análise">Em análise</option>
            <option value="Aprovada">Aprovada</option>
            <option value="Rejeitada">Rejeitada</option>
            <option value="Concluída">Concluída</option>
          </select>

          <button class="btn" onclick="carregarTabela()">Filtrar</button>
        </div>

        <div id="tabelaRequisicoes"></div>
      </section>
    </main>

    <!-- Modal de cadastro -->
    <div id="form-popup" class="overlay" style="display:none;">
      <div class="form-popup">
        <form id="formRequisicao" onsubmit="salvarRequisicao(event)">
          <h2 id="tituloForm">Seleção</h2>

            
            <div style="flex:1;">

              <div style="position: relative; width: 100%;">
                <input 
                    type="text" 
                    id="numero_requisicao" 
                    name="numero_requisicao" 
                    placeholder="Número da Requisição"
                    style="padding-right: 35px; width: 100%;"
                >

                <i class="fa fa-search"
                onclick="buscarRequisicaoManualmente()"
                style="
                        position: absolute;
                        right: 10px;
                        top: 50%;
                        transform: translateY(-50%);
                        cursor: pointer;
                        color: #0E3E98;
                ">
                </i>
                </div>


              <label class="logo">Candidato</label>
              <input type="text" id="nome" required>

              <label class="logo">Cargo</label>
              <input type="text" id="cargo">

              <label class="logo">Contato</label>
              <input type="text" id="contato">

              <label class="logo">E-mail</label>
              <input type="text" id="email">

              <label class="logo">Data entrevista</label>
              <input type="date" id="data">

              <label class="logo">Fase (Entrevista)</label>
              <input type="number" id="fase" value="5" min="1">

              <label class="logo">Formação Acadêmica</label>
              <input type="text" id="formacao">

              <label class="logo">Síntese da Entrevista Comportamental </label>
              <input type="text" id="sintese">

              <label class="logo">Conclusão </label>
              <input type="text" id="conclusao">

              <select id="modo" required>
                <option value="Online">Online</option>
                <option value="Presencial">Presencial</option>
              </select>

              <select id="status" required>
                <option value="1. Em processo">Em processo</option>
                <option value="3. Quadro de reserva">Quadro de reserva</option>
                <option value="4. Desclassificado">Desclassificado</option>
                <option value="5. Desistência">Desistência</option>
                <option value="2. Contratado">Contratado</option>
              </select>
              
            </div>

          <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:10px;">
            <button type="submit" class="btn">Salvar</button>
            <button type="button" class="btn" onclick="fecharFormulario()">Fechar</button>
          </div>
        </div>

        </form>
      </div>
    </div>

  <!-- Importação da biblioteca XLSX (necessária para exportar Excel) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <script>
  const usuarioLogado = JSON.parse(localStorage.getItem("usuarioLogado")) || {};
  document.getElementById("usuarioLogado").innerText = usuarioLogado?.nome || "";

  // função auxiliar de formatação
  function formatarData(dataISO) {
    if (!dataISO) return "";
    const data = new Date(dataISO);
    const dia = String(data.getDate()).padStart(2, "0");
    const mes = String(data.getMonth() + 1).padStart(2, "0");
    const ano = data.getFullYear();
    const hora = String(data.getHours()).padStart(2, "0");
    const minuto = String(data.getMinutes()).padStart(2, "0");
    const segundo = String(data.getSeconds()).padStart(2, "0");
    return `${dia}/${mes}/${ano}`; // ${hora}:${minuto}:${segundo}`;
  } 

  let editandoId = null;
  const API = "/api/processo_seletivo"; // base da API

  function abrirFormulario(){
    document.getElementById("form-popup").style.display = "flex";
    document.getElementById("tituloForm").innerText = "Seleção";
    editandoId = null;
    document.getElementById("formRequisicao").reset();
  }

  function fecharFormulario(){
    document.getElementById("form-popup").style.display = "none";
    editandoId = null;
    document.getElementById("formRequisicao").reset();
  }

  function sair(){
    localStorage.removeItem("usuarioLogado");
    alert("Sessão encerrada.");
  }

  // === SALVAR OU ATUALIZAR ===
async function salvarRequisicao(event){
  event.preventDefault();

  const unidadeSelecionada = JSON.parse(localStorage.getItem('unidadeSelecionada')) || {};
  const usuarioLogado = JSON.parse(localStorage.getItem("usuarioLogado")) || {};

    const dados = {
        numero_requisicao: document.getElementById("numero_requisicao").value.trim(),
        nome: document.getElementById("nome").value.trim(),
        cargo: document.getElementById("cargo").value.trim(),
        contato: document.getElementById("contato").value.trim(),
        email: document.getElementById("email").value.trim(),
        data: document.getElementById("data").value || new Date().toISOString().slice(0,10),
        fase: document.getElementById("fase").value || 1,
        formacao: document.getElementById("formacao").value.trim(),
        sintese: document.getElementById("sintese").value.trim(),
        conclusao: document.getElementById("conclusao").value.trim(),
        modo: document.getElementById("modo").value,
        status: document.getElementById("status").value,
        empresa: unidadeSelecionada.nome || '',
        usuario: usuarioLogado.nome || usuarioLogado.id || ''
    };


  const url = editandoId ? `${API}/${editandoId}` : API;
  const method = editandoId ? "PUT" : "POST";

  const resp = await fetch(url, {
    method: method,
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(dados)
  });

  const resultado = await resp.json();
  alert(resultado.mensagem || "Operação concluída.");

  if (resultado.sucesso) {
    fecharFormulario();
    carregarTabela();
  }
}

// === EDITAR ===
async function editar(id){
  const resp = await fetch(`${API}/${id}`);
  const resultado = await resp.json();

  if(!resultado.sucesso){
    alert(resultado.mensagem || "Erro ao carregar registro.");
    return;
  }

  const r = resultado.dado;

  abrirFormulario();
  editandoId = id;
  tituloForm.innerText = "Editar Seleção";

  numero_requisicao.value = r.numero_requisicao || "";
  nome.value = r.nome || "";
  cargo.value = r.cargo || "";
  contato.value = r.contato || "";
  email.value = r.email || "";
  data.value = r.data ? r.data.split("T")[0] : "";
  fase.value = r.fase || "1";
  formacao.value = r.formacao || "";
  sintese.value = r.sintese || "";
  conclusao.value = r.conclusao || "";
  modo.value = r.modo || "Presencial";
  status.value = r.status || "Em processo";
}

// === ATUALIZAR REGISTRO ===
async function atualizar(event, id){
  event.preventDefault();
  await salvarRequisicao(event);  
}

  // === CARREGAR ===
  async function carregarTabela() {
    const unidadeSelecionada = JSON.parse(localStorage.getItem('unidadeSelecionada'));
    if (!unidadeSelecionada) {
      document.getElementById("tabelaRequisicoes").innerHTML = "<p>Selecione uma unidade.</p>";
      return;
    }

    const mes = document.getElementById("filtroMes").value;
    const ano = document.getElementById("filtroAno").value;
    const status = document.getElementById("filtroStatus").value;

    const params = new URLSearchParams({
      unidade: unidadeSelecionada.nome,
      mes,
      ano,
      status
    });

    const resp = await fetch(`${API}?${params.toString()}`);
    const dados = await resp.json();

    if (!dados.sucesso) {
      alert("Erro ao carregar registros.");
      return;
    }

    const registros = dados.dados;
    const container = document.getElementById("tabelaRequisicoes");

    if (!registros.length) {
      container.innerHTML = "<p>Nenhum registro encontrado para os filtros selecionados.</p>";
      return;
    }

    // Agrupar por status (ex.: Pendente, Aprovada, etc.)
    const grupos = [...new Set(registros.map(t => t.status || 'Sem Status'))];

    container.innerHTML = grupos.map(grp => {
      const items = registros.filter(t => (t.status||'') === grp);
      return `
        <div class="grupo-tipo">
          <h3>${grp} (${items.length})</h3>
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Nº Requisição</th>
                <th>Data Solicitação</th>
                <th>Solicitante</th>
                <th>Cargo</th>
                <th>Fase</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              ${items.map(i => `
                <tr>
                  <td>${i.id}</td>
                  <td>${i.numero_requisicao || '-'}</td>
                  <td>${formatarData(i.data)}</td>
                  <td>${i.nome || ''}</td>
                  <td>${i.cargo || ''}</td>
                  <td>${i.fase || ''}</td>
                  
                  <td>
                    <button class="btn" onclick="editar(${i.id})">Editar</button>
                    
                    <button class="btn" onclick="PDF(${i.id})">PDF</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }).join('');
  }

  // === EXCLUIR ===
  async function excluir(id){
    if(!confirm("Tem certeza que deseja excluir esta requisição?")) return;
    const resp = await fetch(`${API}/${id}`, { method: "DELETE" });
    const resultado = await resp.json();
    alert(resultado.mensagem || "Resposta recebida.");
    if(resultado.sucesso) carregarTabela();
  }

  // === EXPORTAR ===
  function exportarTabela() {
    const unidadeSelecionada = JSON.parse(localStorage.getItem('unidadeSelecionada'));
    const nomeUnidade = unidadeSelecionada ? unidadeSelecionada.nome.replace(/\s+/g, "_") : "Sem_Unidade";

    const tabelas = document.querySelectorAll("#tabelaRequisicoes table");
    if (!tabelas.length) { alert("Nenhum dado encontrado para exportar."); return; }
    const wb = XLSX.utils.book_new();

    tabelas.forEach((tabela, index) => {
      const titulo = tabela.closest(".grupo-tipo")?.querySelector("h3")?.textContent || `Tabela_${index + 1}`;
      const ws = XLSX.utils.table_to_sheet(tabela);
      XLSX.utils.book_append_sheet(wb, ws, titulo.substring(0,31));
    });

    const nomeArquivo = `Genesis_Lotus_Requisicoes_Pessoal_${nomeUnidade}.xlsx`;
    XLSX.writeFile(wb, nomeArquivo);
  }

  async function PDF(id) {
    try {
      const resp = await fetch(`${API}/${id}`);
      const resultado = await resp.json();

      if (!resultado.sucesso || !resultado.dado) {
        alert("Erro ao gerar PDF: " + (resultado.mensagem || "Registro não encontrado."));
        return;
      }

      const r = resultado.dado;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      // Cabeçalho
      doc.setFontSize(16);
      doc.text("AVALIAÇÃO DE CANDIDATO", 105, 15, { align: "center" });

      doc.addImage('/static/image/genesis1.png', 'JPEG', 10, 5, 30, 12);

      doc.setFontSize(10);
      doc.text(`Número: ${r.numero_requisicao || '-'}`, 14, 25);
      doc.text(`Data Entrevista: ${formatarData(r.data)}`, 85   , 25);
      doc.text(`Status: ${r.status || '-'}`, 150, 25);

      // Linha separadora
      doc.line(10, 28, 200, 28);

      // Seção 1 — Dados da vaga
      doc.setFontSize(12);
      doc.text("Detalhes", 14, 36);
      doc.setFontSize(10);
      let y = 42;
      const espacamento = 6;

      const dadosVaga = [
        ["Modo de entrevista", r.modo],
        ["Cargo", r.cargo],
        ["Candidato", r.nome],
        ["Contato", r.contato],
        ["E-mail", r.email],
        ["Formação acadêmica", r.formacao],
        ["",],
        ["Sintese", r.sintese],
        ["Conclusão", r.conclusao]
      ];

      dadosVaga.forEach(([label, valor]) => {
        doc.text(`${label}: ${valor || ''}`, 14, y);
        y += espacamento;
        if (y > 270) { // quebra de página se estiver cheio
          doc.addPage();
          y = 20;
        }
      });

      // Rodapé
      doc.setFontSize(9);
      doc.text("© 2025 Genesis Lotus", 105, 290, { align: "center" });

      // Salvar PDF
      const nomeArquivo = `Processo_Seletivo_${r.nome}.pdf`;
      doc.save(nomeArquivo);

    } catch (erro) {
      alert("Erro ao gerar PDF: " + erro.message);
      console.error(erro);
    }
  }

  // === Unidades permitidas (mantive seu endpoint antigo) ===
  carregarTabela();
  carregarUnidades();

  async function carregarUnidades() {
    try {
      const resp = await fetch(`/api/unidades_permitidas?usuario_id=${usuarioLogado.id || ''}`);
      const dados = await resp.json();
      if (dados.sucesso) {
        const select = document.getElementById('selectUnidade');
        select.innerHTML = '<option value="">Selecione a Unidade</option>';
        dados.unidades.forEach(u => {
          const nomes = (u.nome || "").split(";").map(n => n.trim()).filter(Boolean);
          nomes.forEach(nome => {
            const opt = document.createElement("option");
            opt.value = u.id;
            opt.textContent = nome;
            select.appendChild(opt);
          });
        });
        const unidadeSalva = JSON.parse(localStorage.getItem('unidadeSelecionada'));
        if (unidadeSalva) select.value = unidadeSalva.id;
        else if (dados.unidades.length > 0) {
          const u0 = dados.unidades[0];
          select.value = u0.id;
          localStorage.setItem('unidadeSelecionada', JSON.stringify(u0));
        }
      }
    } catch (err) {
      console.error("Erro ao carregar unidades:", err);
    }
  }

  document.getElementById('selectUnidade').addEventListener('change', () => {
    const select = document.getElementById('selectUnidade');
    const id = select.value;
    const nome = select.options[select.selectedIndex].text;
    if (id) localStorage.setItem('unidadeSelecionada', JSON.stringify({ id, nome }));
    else localStorage.removeItem('unidadeSelecionada');
  });

  

async function buscarRequisicaoManualmente() {
    const numeroReq = document.getElementById("numero_requisicao").value.trim();

    if (!numeroReq) {
        alert("Digite o número da requisição.");
        return;
    }

    try {
        const resp = await fetch(`/api/buscar_requisicao?numero=${numeroReq}`);
        const dados = await resp.json();

        if (dados.sucesso && dados.dado) {
            document.getElementById("cargo").value = dados.dado.titulo_cargo || "";
        } else {
            alert("Requisição não encontrada para esta empresa.");
        }
    } catch (e) {
        console.error("Erro ao buscar requisição:", e);
        alert("Erro ao consultar requisição.");
    }
}



  document.addEventListener("DOMContentLoaded", () => {
    // garantir que unidades carreguem no load
    carregarUnidades();
    carregarTabela();
  });
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  </body>
  </html>
