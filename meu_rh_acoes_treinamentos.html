<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ações / Treinamentos</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/static/css/style.css">

<style>

/* Fundo escurecido ao abrir o formulário */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

/* Container do formulário */
.form-popup {
  background-color: #fff;
  padding: 25px 30px;
  border-radius: 15px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  animation: fadeIn 0.3s ease-in-out;
}

/* Título */
.form-popup h2 {
  text-align: center;
  color: #0D187D;
  margin-bottom: 20px;
  font-size: 1.5rem;
}

/* Campos do formulário */
.form-popup input,
.form-popup textarea,
.form-popup select {
  width: 100%;
  padding: 10px 12px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 0.95rem;
  transition: 0.2s;
}

/* Foco no campo */
.form-popup input:focus,
.form-popup textarea:focus,
.form-popup select:focus {
  border-color: #0D187D;
  outline: none;
  box-shadow: 0 0 5px rgba(13,24,125,0.3);
}

/* Botões do formulário */
.form-popup .btn {
  width: 48%;
  margin: 10px 1%;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background-color: #0D187D;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

.form-popup .btn:hover {
  background-color: #0E3E98;
}

/* Animação de entrada suave */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

</style>

</head>
<body>
  <aside>
    <div>
      <div class="logo">
      <img src="/static/image/LogoGenesis-Lotus2.png" alt="Genesis Lotus" class="logo-img">
      </div>
      <h4>Olá, <span id="usuarioLogado"></span></p></h4   >
      <nav>
        <a href="inicio"><i class="fa-solid fa-chart-line"></i> Início</a>
        <a href="indicadores"><i class="fa-solid fa-bullseye"></i> Indicadores</a>
        <a href="meu_rh"><i class="fa-solid fa-puzzle-piece"></i> Meu RH</a>
        <a href="meu_rh_acoes_treinamentos" class="active"><i class="fa-solid fa-chalkboard-teacher"></i> Ações e Treinamentos</a>
        <a href="meu_rh_avaliacao_experiencia"><i class="fa-solid fa-book-open"></i> Avaliação de Experiência</a>
        <a href="meu_rh_requisicao_pessoal"><i class="fa-solid fa-chalkboard-teacher"></i> Requisições de Pessoal</a>
        <a href="meu_rh_entrevista_desligamento"><i class="fa-solid fa-chalkboard-teacher"></i> Entrevista de Desligamento</a>
      </nav>
    </div>
    <footer style="text-align:center; font-size:0.8rem; opacity:0.8;">
      <div class="logo">
        <img src="/static/image/Genesis1.png" alt="Genesis Lotus" class="logo-img">
      </div>
    <h4>© 2025 Genesis Lotus</h4>
  </footer>
  </aside>

  <main>
    <header>
      <h1>Ações / Treinamentos</h1>
      <div>
        <button class="btn" onclick="abrirFormulario()">Novo Registro</button>
        <button class="btn" onclick="exportarTabela()">Exportar</button>
        <select id="selectUnidade" class="btn" style="padding: 9px 14px;">
          <option value="">Selecione a Unidade</option>
        </select>
        <button class="btn" onclick="sair()">Sair</button>
      </div>
    </header>

    <section>
      <div class="filters">
  <label>Mês:</label>
  <select id="filtroMes" class="btn">
    <option value="">Todos</option>
    <option value="01">Janeiro</option>
    <option value="02">Fevereiro</option>
    <option value="03">Março</option>
    <option value="04">Abril</option>
    <option value="05">Maio</option>
    <option value="06">Junho</option>
    <option value="07">Julho</option>
    <option value="08">Agosto</option>
    <option value="09">Setembro</option>
    <option value="10">Outubro</option>
    <option value="11">Novembro</option>
    <option value="12">Dezembro</option>
  </select>

  <label>Ano:</label>
  <input type="number" class="btn" id="filtroAno" placeholder="Ano" style="width:100px">

  <button class="btn" onclick="carregarTabela()">Filtrar</button>
</div>


      <div id="tabelaTreinamentos"></div>
    </section>
  </main>

  <!-- Modal de cadastro -->
<div id="form-popup" class="overlay" style="display:none;">
  <div class="form-popup">
    
    <form id="formTreinamento" onsubmit="salvarTreinamento(event)">
      <h2>Novo Registro</h2>
      <input type="text" id="tema" placeholder="Tema" required>
      <textarea id="realizado" placeholder="O que foi realizado" required></textarea>
      <input type="date" id="dataRealizacao" required>
      <input type="text" id="local" placeholder="Local">
      <select id="tipoAcao">
        <option value="Treinamento">Treinamento</option>
        <option value="Ação">Ação</option>
      </select>
      <input type="number" id="duracao" placeholder="Duração (horas)" min="0" step="0.1">
      <input type="text" id="departamento" placeholder="Departamento Responsável">
      <input type="text" id="responsavel" placeholder="Pessoal Responsável">
      <select id="modalidade">
        <option value="Presencial">Presencial</option>
        <option value="Virtual">Virtual</option>
      </select>
      <select id="pat">
        <option value="Sim">Sim</option>
        <option value="Não">Não</option>
      </select>
      <input type="number" id="participantes" placeholder="Total de Participantes" min="0">
      <button type="submit" class="btn">Salvar</button>
      <button type="button" class="btn" onclick="fecharFormulario()">Fechar</button>
    </form>
  </div>
</div>

<!-- Importação da biblioteca XLSX (necessária para exportar Excel) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>

const usuarioLogado = JSON.parse(localStorage.getItem("usuarioLogado"));
document.getElementById("usuarioLogado").innerText = usuarioLogado?.nome || "";

let editandoId = null;

const API = "http://localhost:5000/acoes_treinamentos";

// função auxiliar de formatação
  function formatarData(dataISO) {
    if (!dataISO) return "";
    const data = new Date(dataISO);
    const dia = String(data.getDate()).padStart(2, "0");
    const mes = String(data.getMonth() + 1).padStart(2, "0");
    const ano = data.getFullYear();
    const hora = String(data.getHours()).padStart(2, "0");
    const minuto = String(data.getMinutes()).padStart(2, "0");
    const segundo = String(data.getSeconds()).padStart(2, "0");
    return `${dia}/${mes}/${ano}`; // ${hora}:${minuto}:${segundo}`;
  } 

function abrirFormulario(){
  document.getElementById("form-popup").style.display = "flex";
  editandoId = null;
  // ✅ Garante que o botão volte ao modo "salvar novo"
  document.querySelector("#formTreinamento button[type='submit']").onclick = salvarTreinamento;
  document.querySelector("#formTreinamento h2").innerText = "Novo Registro";

}

function fecharFormulario(){
  document.getElementById("form-popup").style.display = "none";
  document.getElementById("formTreinamento").reset();
  editandoId = null;
}

function sair(){
  localStorage.removeItem("usuarioLogado");
  alert("Sessão encerrada.");
}

// === SALVAR (NOVO) ===
async function salvarTreinamento(event){
  event.preventDefault();

  // 🔹 PEGAR EMPRESA (unidade) SELECIONADA
  const unidadeSelecionada = JSON.parse(localStorage.getItem('unidadeSelecionada'));

  const dados = {
    empresa: unidadeSelecionada ? unidadeSelecionada.nome : null, // 🔹 <--- AJUSTE AQUI
    tema: document.getElementById("tema").value,
    realizado: document.getElementById("realizado").value,
    dataRealizacao: document.getElementById("dataRealizacao").value,
    local: document.getElementById("local").value,
    tipoAcao: document.getElementById("tipoAcao").value,
    duracao: document.getElementById("duracao").value,
    departamento: document.getElementById("departamento").value,
    responsavel: document.getElementById("responsavel").value,
    modalidade: document.getElementById("modalidade").value,
    pat: document.getElementById("pat").value,
    participantes: document.getElementById("participantes").value
  };

  const resp = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(dados)
  });
  const resultado = await resp.json();
  alert(resultado.mensagem);
  if(resultado.sucesso){
    fecharFormulario();
    carregarTabela();
  }
}

// === CARREGAR ===
async function carregarTabela() {
  const unidadeSelecionada = JSON.parse(localStorage.getItem('unidadeSelecionada'));
  if (!unidadeSelecionada) {
    document.getElementById("tabelaTreinamentos").innerHTML = "<p>Selecione uma unidade.</p>";
    return;
  }

  const mes = document.getElementById("filtroMes").value;
  const ano = document.getElementById("filtroAno").value;

  // Monta query string com filtros
  const params = new URLSearchParams({
    unidade: unidadeSelecionada.nome,
    mes,
    ano
  });

  const resp = await fetch(`/acoes_treinamentos?${params.toString()}`);
  const dados = await resp.json();

  if (!dados.sucesso) {
    alert("Erro ao carregar registros.");
    return;
  }

  const registros = dados.dados;
  const container = document.getElementById("tabelaTreinamentos");

  if (!registros.length) {
    container.innerHTML = "<p>Nenhum registro encontrado para os filtros selecionados.</p>";
    return;
  }

  // 🔹 Agrupar por tipo_acao
  const tipos = [...new Set(registros.map(t => t.tipo_acao))];

  container.innerHTML = tipos.map(tipo => {
    const items = registros.filter(t => t.tipo_acao === tipo);
    return `
      <div class="grupo-tipo">
        <h3>${tipo}</h3>
        <table>
          <thead>
            <tr>
              <th>Tema</th><th>Realizado</th><th>Data</th><th>Local</th><th>Tipo</th>
              <th>Duração</th><th>Departamento</th><th>Responsável</th><th>Modalidade</th>
              <th>PAT</th><th>Participantes</th><th>Ações</th>
            </tr>
          </thead>
          <tbody>
            ${items.map(i => `
              <tr>
                <td>${i.tema}</td>
                <td>${i.realizado}</td>
                <td>${formatarData(i.data_realizacao)}</td>
                <td>${i.local}</td>
                <td>${i.tipo_acao}</td>
                <td>${i.duracao}</td>
                <td>${i.departamento}</td>
                <td>${i.responsavel}</td>
                <td>${i.modalidade}</td>
                <td>${i.pat}</td>
                <td>${i.participantes}</td>
                <td>
                  <button class="btn" onclick="editar(${i.id})">Editar</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  }).join('');
}


// === EDITAR ===
async function editar(id){
  const resp = await fetch(API);
  const dados = await resp.json();
  const reg = dados.dados.find(r => r.id === id);
  if(!reg) return;

  abrirFormulario();
  editandoId = id;

  document.getElementById("tema").value = reg.tema;
  document.getElementById("realizado").value = reg.realizado;
  // ✅ Converte a data para formato aceito pelo input date
  if (reg.data_realizacao) {
    document.getElementById("dataRealizacao").value = new Date(reg.data_realizacao).toISOString().split('T')[0];
  } else {  
    document.getElementById("dataRealizacao").value = "";
  }
  document.getElementById("local").value = reg.local;
  document.getElementById("tipoAcao").value = reg.tipo_acao;
  document.getElementById("duracao").value = reg.duracao;
  document.getElementById("departamento").value = reg.departamento;
  document.getElementById("responsavel").value = reg.responsavel;
  document.getElementById("modalidade").value = reg.modalidade;
  document.getElementById("pat").value = reg.pat;
  document.getElementById("participantes").value = reg.participantes;

  // document.querySelector("#formTreinamento button[type='submit']").onclick = (e) => atualizar(e, id);
  document.querySelector("#formTreinamento h2").innerText = "Editar Registro";
  document.querySelector("#formTreinamento button[type='submit']").onclick = (e) => atualizar(e, id);

}

// === ATUALIZAR ===
async function atualizar(event, id){
  event.preventDefault();

  // 🔹 PEGAR EMPRESA (unidade) SELECIONADA
  const unidadeSelecionada = JSON.parse(localStorage.getItem('unidadeSelecionada'));

  const dados = {
    empresa: unidadeSelecionada ? unidadeSelecionada.nome : null, // 🔹 <--- AJUSTE AQUI
    tema: tema.value,
    realizado: realizado.value,
    dataRealizacao: dataRealizacao.value,
    local: local.value,
    tipoAcao: tipoAcao.value,
    duracao: duracao.value,
    departamento: departamento.value,
    responsavel: responsavel.value,
    modalidade: modalidade.value,
    pat: pat.value,
    participantes: participantes.value
  };

  const resp = await fetch(`${API}/${id}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(dados)
  });
  const resultado = await resp.json();
  alert(resultado.mensagem);
  if(resultado.sucesso){
    fecharFormulario();
    carregarTabela();
  }
}

// === EXCLUIR ===
async function excluir(id){
  if(!confirm("Tem certeza que deseja excluir este registro?")) return;
  const resp = await fetch(`${API}/${id}`, { method: "DELETE" });
  const resultado = await resp.json();
  alert(resultado.mensagem);
  if(resultado.sucesso) carregarTabela();
}

function exportarTabela() {
  const unidadeSelecionada = JSON.parse(localStorage.getItem('unidadeSelecionada'));
  const nomeUnidade = unidadeSelecionada ? unidadeSelecionada.nome.replace(/\s+/g, "_") : "Sem_Unidade";

  const tabelas = document.querySelectorAll("#tabelaTreinamentos table");

  if (!tabelas.length) {
    alert("Nenhum dado encontrado para exportar.");
    return;
  }

  const wb = XLSX.utils.book_new();

  tabelas.forEach((tabela, index) => {
    const titulo = tabela.closest(".grupo-tipo")?.querySelector("h3")?.textContent || `Tabela_${index + 1}`;
    const ws = XLSX.utils.table_to_sheet(tabela);
    XLSX.utils.book_append_sheet(wb, ws, titulo);
  });

  const nomeArquivo = `Genesis_Lotus_Exportação_Ações_e_Treinamentos_${nomeUnidade}.xlsx`;
  XLSX.writeFile(wb, nomeArquivo);
}


carregarTabela();
carregarUnidades();

// === Carregar unidades com permissão ===
async function carregarUnidades() {
  try {
    const resp = await fetch(`/api/unidades_permitidas?usuario_id=${usuarioLogado.id}`);
    const dados = await resp.json();

    if (dados.sucesso) {
      const select = document.getElementById('selectUnidade');
      select.innerHTML = '<option value="">Selecione a Unidade</option>';

      dados.unidades.forEach(u => {
        // Separa o nome em várias partes quando houver ";"
        const nomes = u.nome.split(";").map(n => n.trim()).filter(n => n !== "");

        // Cria uma opção para cada nome encontrado
        nomes.forEach(nome => {
          const opt = document.createElement("option");
          opt.value = u.id;  // mantém o mesmo id
          opt.textContent = nome;
          select.appendChild(opt);
        });
      });

      const unidadeSalva = JSON.parse(localStorage.getItem('unidadeSelecionada'));

      if (unidadeSalva) {
        select.value = unidadeSalva.id;
      } else if (dados.unidades.length > 0) {
        select.value = dados.unidades[0].id;
        localStorage.setItem('unidadeSelecionada', JSON.stringify(dados.unidades[0]));
      }
    }
  } catch (err) {
    console.error("Erro ao carregar unidades:", err);
  }
}

document.getElementById('selectUnidade').addEventListener('change', () => {
  const select = document.getElementById('selectUnidade');
  const id = select.value;
  const nome = select.options[select.selectedIndex].text;
  
  if (id) {
    localStorage.setItem('unidadeSelecionada', JSON.stringify({ id, nome }));
  } else {
    localStorage.removeItem('unidadeSelecionada');
  }
});

document.addEventListener("DOMContentLoaded", () => {
  carregarUnidades();
});

</script>

</body>
</html>
