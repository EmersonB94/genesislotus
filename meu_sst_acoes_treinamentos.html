<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ações / Treinamentos</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/static/css/style.css">

<style>

/* Fundo escurecido ao abrir o formulário */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

/* Container do formulário */
.form-popup {
  background-color: #fff;
  padding: 25px 30px;
  border-radius: 15px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  animation: fadeIn 0.3s ease-in-out;
}

/* Título */
.form-popup h2 {
  text-align: center;
  color: #0D187D;
  margin-bottom: 20px;
  font-size: 1.5rem;
}

/* Campos do formulário */
.form-popup input,
.form-popup textarea,
.form-popup select {
  width: 100%;
  padding: 10px 12px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 0.95rem;
  transition: 0.2s;
}

/* Foco no campo */
.form-popup input:focus,
.form-popup textarea:focus,
.form-popup select:focus {
  border-color: #0D187D;
  outline: none;
  box-shadow: 0 0 5px rgba(13,24,125,0.3);
}

/* Botões do formulário */
.form-popup .btn {
  width: 48%;
  margin: 10px 1%;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background-color: #0D187D;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

.form-popup .btn:hover {
  background-color: #0E3E98;
}

/* Animação de entrada suave */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

</style>

</head>
<body>
  <aside>
    <div>
      <div class="logo">
      <img src="/static/image/LogoGenesis-Lotus2.png" alt="Genesis Lotus" class="logo-img">
      </div>
      <h4>Olá, <span id="usuarioLogado"></span></p></h4   >
      <nav>
        <a href="inicio"><i class="fa-solid fa-chart-line"></i> Início</a>
        <a href="indicadores"><i class="fa-solid fa-bullseye"></i> Indicadores</a>
        <a href="meu_sst"><i class="fa-solid fa-puzzle-piece"></i> Meu SST</a>
        <a href="meu_sst_acoes_treinamentos" class="active"><i class="fa-solid fa-chalkboard-teacher"></i> Ações e Treinamentos</a>
        <a href="meu_sst_acidentes"><i class="fa-solid fa-chalkboard-teacher"></i> Acidentes</a>
        <a href="meu_sst_asos"><i class="fa-solid fa-chalkboard-teacher"></i> ASOs</a>
      </nav>
    </div>
    <footer style="text-align:center; font-size:0.8rem; opacity:0.8;">
      <div class="logo">
        <img src="/static/image/Genesis1.png" alt="Genesis Lotus" class="logo-img">
      </div>
    <h4>© 2025 Genesis Lotus</h4>
  </footer>
  </aside>

  <main>
    <header>
      <h1>Ações / Treinamentos</h1>
      <div>
        <button class="btn" onclick="abrirFormulario()">Novo Registro</button>
        <button class="btn" onclick="exportarTabela()">Exportar</button>
        <select id="selectUnidade" class="btn" style="padding: 9px 14px;" onclick="carregarTabela()">
          <!-- <option value="">Selecione a Unidade</option> -->
        </select>
        <button class="btn" onclick="sair()">Sair</button>
      </div>
    </header>

    <section>
      <div class="filters">
  <label>Mês:</label>
  <select id="filtroMes" class="btn">
    <option value="">Todos</option>
    <option value="01">Janeiro</option>
    <option value="02">Fevereiro</option>
    <option value="03">Março</option>
    <option value="04">Abril</option>
    <option value="05">Maio</option>
    <option value="06">Junho</option>
    <option value="07">Julho</option>
    <option value="08">Agosto</option>
    <option value="09">Setembro</option>
    <option value="10">Outubro</option>
    <option value="11">Novembro</option>
    <option value="12">Dezembro</option>
  </select>

  <label>Ano:</label>
  <input type="number" class="btn" id="filtroAno" placeholder="Ano" style="width:100px">

  <button class="btn" onclick="carregarTabela()">Filtrar</button>
</div>


      <div id="tabelaTreinamentos"></div>
    </section>
  </main>

  <!-- Modal de cadastro -->
<div id="form-popup" class="overlay" style="display:none;">
  <div class="form-popup">
    
    <form id="formTreinamento" onsubmit="salvarTreinamento(event)">
      <h2>Novo Registro</h2>
      <input type="text" id="tema" placeholder="Tema" required>
      <textarea id="realizado" placeholder="O que foi realizado" required></textarea>
      <input type="date" id="dataRealizacao" required>
      <input type="text" id="local" placeholder="Local">
      <select id="tipoAcao">
        <option value="Treinamento">Treinamento</option>
        <option value="Ação">Ação</option>
      </select>
      <input type="number" id="duracao" placeholder="Duração (horas)" min="0" step="0.1">
      <input type="text" id="departamento" placeholder="Departamento Responsável">
      <input type="text" id="responsavel" placeholder="Pessoal Responsável">
      <input type="text" id="area" value="SST" readonly>
      <select id="modalidade">
        <option value="Presencial">Presencial</option>
        <option value="Online">Online</option>
      </select>
      <select id="pat">
        <option value="Sim">Sim</option>
        <option value="Não">Não</option>
      </select>
      <input type="number" id="participantes" placeholder="Total de Participantes" min="0">
      <select id="statusform">
        <option value="1. Realizado">1. Realizado</option>
        <option value="2. Programado">2. Programado</option>
      </select>
      <button type="submit" class="btn">Salvar</button>
      <button type="button" class="btn" onclick="fecharFormulario()">Fechar</button>
    </form>
  </div>
</div>

<!-- Importação da biblioteca XLSX (necessária para exportar Excel) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<div id="toast-container"></div>

<script src="/static/js/meu_rh_acoes_treinamentos.js"></script>

</body>
</html>
